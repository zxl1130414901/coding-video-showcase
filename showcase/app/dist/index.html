um 依赖与截图开销",deliverableZh:"1080p30 宣传片 30–90 秒",fit:"适合"},{scenarioZh:"Windows 本地批量出片",whoZh:"小型内容工作室",whyZh:"官方提供 win64 预编译包，NVENC 可直接编码",deliverableZh:"每日数十条 720p/1080p 短片",fit:"适合"},{scenarioZh:"无浏览器环境的 CI 渲染",whoZh:"工程团队",whyZh:"不依赖 Chrome headless，容器更轻",deliverableZh:"发版自动生成演示视频",fit:"适合"},{scenarioZh:"HTML 动效交付",whoZh:"设计师、动效作者",whyZh:"普通 HTML 页面直接当视频工程",deliverableZh:"15–60 秒网页动效 MP4",fit:"适合"},{scenarioZh:"复杂 3D 产品片",whoZh:"三维视觉团队",whyZh:"支持 WebGL/3D，但生态与调试工具尚不成熟",deliverableZh:"高清 3D 产品展示",fit:"勉强"}],capabilities:{maxResolutionZh:"未声明上限；实测 1280×720，官方示例含 1080p 场景",maxFpsZh:"未声明；实测 30fps",durationZh:"未声明硬限制；实测短片 2 秒，长片需自行压测",effectsZh:["CSS/SVG/Canvas 2D 绘制","WebGL 着色器与 3D","GPU 合成与图层叠加","Web Audio 离线渲染"],audioZh:"支持 Web Audio 离线渲染并混入成片；不内置 TTS",interactivityZh:"仅离线渲染；附带本地 Studio 编辑器可预览",automationZh:"CLI 可脚本化：kinetograph init / doctor / render，可指定编码器",assetsZh:"public/ 放图片、字体、音频、视频；无内置素材库",exportFormatsZh:["MP4"],realtimePreviewZh:"部分：Studio 本地编辑器可预览，不是实时播放器",ciFriendlyZh:"可进 CI；无浏览器依赖，GPU 可加速，也支持软件渲染"},ceilingZh:"它的上限来自“原生合成”而不是浏览器：官方示例把 1891 年胶片、3D、等距、着色器、Canvas 和玻璃质感镜头放进同一个片子，说明 CSS/SVG/Canvas/WebGL 可以混合。实测用预编译 win64 包渲染默认工程，60 帧 720p30 只用 56.5 秒（含 29 帧静态复用），全程 NVENC 编码，总耗时 131 秒，比同规模 Remotion 更轻。边界：beta 0.3，API 可能破坏性变更；预编译只覆盖 macOS Apple Silicon、Linux x64、Windows x64，其他平台要从源码编译（Rust + FFmpeg，15–30 分钟）；导出目前只有 MP4，没有 PNG 序列或 WebM；调试与错误信息还不如 Remotion Studio 完善；大公司商用要买许可。目前缺少 Studio 式预览，改一行 TSX 要整片重渲才能看到效果，迭代节奏比 Remotion 慢；社区与示例也少。",workflow:[{stepZh:"安装",detailZh:"Node ≥22，npm install kinetograph，再 npx kinetograph doctor 自检",effortZh:"约 1 分钟"},{stepZh:"建工程",detailZh:"npx kinetograph init（TSX）或 init --html，生成 src/、public/、out/",effortZh:"约 2 分钟"},{stepZh:"写画面",detailZh:"用 Remotion API 写 Composition，或把现成 HTML/HyperFrames 页面放进 html/",effortZh:"按项目而定"},{stepZh:"渲染",detailZh:"npx kinetograph render src/index.tsx，可加 --encoder h264_nvenc，产物在 out/renders/",effortZh:"2 秒 720p 约 1 分钟"},{stepZh:"校验",detailZh:"ffprobe 查分辨率/帧率/时长，Studio 里抽查关键帧",effortZh:"约 5 分钟"}],differentiators:["完全不需要浏览器：Node 执行 + Rust GPU 合成，省掉 Chromium 进程与截图回读","直接兼容 Remotion 与 HyperFrames 工程，迁移成本低","同一引擎支持 CSS/SVG/Canvas/WebGL/3D/Web Audio，不限二维","预编译包覆盖 Windows x64，NVENC 硬件编码开箱可用"],limits:["beta 0.3，API 可能随时破坏性变更，不适合长期生产依赖","PolyForm Small Business 许可：100 人以上或年收入 100 万美元以上需商业授权","只输出 MP4，没有 PNG 序列、WebM、透明通道等选项","预编译只覆盖三个平台，其他平台需源码编译 Rust + FFmpeg"],compareTips:[{vs:"remotion-dev__remotion",adviceZh:"要稳定 API、Studio 调试和云端批量选 Remotion；要摆脱浏览器、复用 TSX 且能接受 beta 选 Kinetograph"},{vs:"BintzGavin__helios",adviceZh:"依赖 CSS 原生动效与网页播放器选 Helios；要无浏览器的原生合成与硬件编码选 Kinetograph"},{vs:"LBEILC__Multiplane",adviceZh:"Multiplane 走 HTML+Playwright 多 worker，调试直观；Kinetograph 无浏览器、单机更快，但生态更小"}],showcase:{demoBriefZh:"四段：①kinetograph doctor 与环境自检；②默认 TSX 工程的标题卡动画；③HTML/HyperFrames 页面直接渲染，证明无浏览器；④NVENC 出片后用 ffprobe 展示 720p30、60 帧、静态帧复用",featureCallouts:[{titleZh:"无浏览器渲染",descZh:"Node 负责执行，Rust 逐帧绘制"},{titleZh:"Remotion 兼容",descZh:"现有 TSX 工程原样跑"},{titleZh:"GPU 合成",descZh:"CSS、Canvas、WebGL 可混合叠层"},{titleZh:"NVENC 编码",descZh:"一步出 MP4，不落中间帧"},{titleZh:"Windows 预编译",descZh:"npm 安装后即可渲染"}]},evidence:[{field:"taglineZh",source:"README.md#L17-L23",noteZh:"自述 makes videos from code, without a browser；Node 执行，Rust GPU compositor 画帧"},{field:"capabilities.automationZh",source:"README.md#L25-L66",noteZh:"npm install、doctor、init、render 的真实命令与 out/renders/Main.mp4 路径"},{field:"limits",source:"README.md#L100-L105",noteZh:"PolyForm Small Business 1.0.0，100 人/100 万美元门槛"},{field:"ceilingZh",source:"_samples/0xS4N4TG__kinetograph/meta.json",noteZh:"实测 720p30/60 帧，render 56.5s，总 131s，h264_nvenc，29 帧静态复用"}]},"3b1b__manim":{id:"3b1b__manim",taglineZh:"3b1b 自用的实时 OpenGL 数学动画引擎，能在窗口里拖着时间轴调镜头",summaryZh:"ManimGL 是 3Blue1Brown 自用的引擎：OpenGL 实时渲染，可开交互窗口拖动时间轴、用 checkpoint_paste 热重载某段代码而保留场景状态，这是 3b1b 调镜头的真实工作方式。它与社区版 ManimCE 是两套 API，名字相同但不能互换：manimgl 命令、`manimlib` 包、交互优先。96k stars 意味着教程极多，但也意味着大量教程版本串味；Windows 需自装 FFmpeg、OpenGL 与 MiKTeX，Python 3.13 还要补 audioop-lts 和 setuptools<81。实测 720p30 的 360 帧 56.6 秒。官方文档站与视频教程是主要学习入口，社区版 ManimCE 的教程基本不适用。",whatItMakes:[{type:"数学/物理解释动画",exampleZh:"公式逐行推导、坐标系变换、向量场",strength:"核心能力"},{type:"三维曲面与相机运镜",exampleZh:"参数曲面、空间曲线，相机沿轨道推拉旋转",strength:"核心能力"},{type:"实时调镜头工作流",exampleZh:"交互窗口里拖时间轴、热重载单段代码反复试镜头",strength:"核心能力"},{type:"LaTeX 公式排版",exampleZh:"TransformMatchingTex 做公式项级变换",strength:"核心能力"},{type:"带旁白的课件",exampleZh:"需另装 manim-voiceover，本引擎不带 TTS 与字幕",strength:"受限"},{type:"无头批量渲染",exampleZh:"服务器无 OpenGL 上下文时无法运行",strength:"受限"}],useCases:[{scenarioZh:"大学数学/物理网课",whoZh:"讲师、课程制作团队",whyZh:"公式推导 + 3D 几何是它的主场，成片观感接近 3b1b",deliverableZh:"1080p30 MP4，单集 5–20 分钟",fit:"高度契合"},{scenarioZh:"科普频道动画",whoZh:"科普作者",whyZh:"相机语言与 3D 场景表现力强，适合讲抽象概念",deliverableZh:"3–10 分钟 1080p MP4",fit:"适合"},{scenarioZh:"实时试镜头",whoZh:"动画导演、技术美术",whyZh:"交互窗口拖时间轴、checkpoint_paste 热重载，迭代速度远快于改一次渲一次",deliverableZh:"可反复调整的场景文件",fit:"高度契合"},{scenarioZh:"纯脚本化 CI 出片",whoZh:"后端/工具链团队",whyZh:"依赖 OpenGL 上下文，无头服务器易失败，且 API 与 CE 教程不通用",deliverableZh:"需要带 GPU 或虚拟 GL 的 runner",fit:"勉强"},{scenarioZh:"三维几何教学",whoZh:"中学/大学教师",whyZh:"曲面、空间向量、投影的相机演示直观，但学习曲线陡",deliverableZh:"30 秒–3 分钟片段",fit:"适合"}],capabilities:{maxResolutionZh:"配置文件可设，实测 1280×720；支持 1080p 与 4K 渲染，帧率与分辨率越高显存压力越大",maxFpsZh:"默认 30，可配置到 60；实测 30fps",durationZh:"不限，长片由多个场景与剪辑拼接",effectsZh:["OpenGL 实时 3D 场景","相机推拉/旋转/跟随","Transform 与 TransformMatchingTex","运动轨迹与矢量场","后期泛光与景深效果"],audioZh:"无内置配音与混音，需外接 manim-voiceover 或后期合成",interactivityZh:"强：交互模式可拖动时间轴、-se 定位到某行、checkpoint_paste 热重载选中代码",automationZh:"manimgl CLI 支持 -w 写出、-se 交互，可脚本调用；但无头环境受 OpenGL 限制",assetsZh:"LaTeX 字体、SVG、图片；专用字体需自行安装",exportFormatsZh:["mp4","gif","png（单帧）"],realtimePreviewZh:"有，OpenGL 窗口实时渲染",ciFriendlyZh:"较弱：需要 OpenGL 上下文，纯 CPU 容器通常失败"},ceilingZh:"实测 360 帧 720p30 用 56.6 秒（约 6.4fps），这个速度足够做 10 分钟级长片：按线性推算 1080p 一分钟约 3 分钟渲染。能力上限接近 3b1b 成片：OpenGL 实时 3D、相机轨道、公式项级变换，配合 4K 配置可以出 3840×2160；最复杂的效果是三维光场/曲面叠加后期泛光。边界明确：README 要求系统具备 OpenGL，无头服务器没有 GL 上下文就跑不起来；API 与 ManimCE 完全分离，网上九成教程不能直接用；Windows 要装 FFmpeg 与 MiKTeX，Python 3.13 还需补 audioop-lts、setuptools<81 才能装；没有配音/字 3b1b 的成片本身：1080p、30fps、单集 10–30 分钟的多场景长片，含 3D 光场、相机绕行、LaTeX 公式逐行变换，画面精度与镜头节奏属于行业天花板。但仓库只给场景源码，不给渲染编排：没有批量脚本、没有资产打包、没有统一入口，实测单场景 12 秒 360 帧需 56.6 秒。最复杂的用法不是跑通，而是读懂 Optics 系列里相机与 3D 对象的坐标关系并复用。硬边界：CC BY-NC-SA 4.0 禁止商用；README 明说老项目依赖旧版 manim，可能无法直接运行；每个 .py 依赖同目录常量与资产，单独拷出必然失败。仓库还缺少依赖清单与渲染脚本，环境版本只能从老 commit 里倒推。",workflow:[{stepZh:"装 ManimGL 源码版",detailZh:"README 要求从源码安装 manimgl，因为 PyPI 版本不够新；同时装 FFmpeg",effortZh:"约 30 分钟"},{stepZh:"装 TeX 全量",detailZh:"Ubuntu 需 texlive、texlive-latex-extra、fonts-extra、science；Windows 一般用 MiKTeX",effortZh:"数 GB 下载，约 1 小时"},{stepZh:"克隆并补路径",detailZh:"git clone 后在目标场景顶部加 sys.path.append('.') 与父级目录",effortZh:"约 10 分钟"},{stepZh:"跑单场景",detailZh:"manimgl e_field.py WavesIn3D，先用 -se 进交互模式调镜头",effortZh:"单场景数分钟"},{stepZh:"串成片",detailZh:"逐场景出片后用 ffmpeg 或剪辑软件拼接，仓库不提供这步",effortZh:"按片长而定"}],differentiators:["唯一一份 3b1b 官方生产源码，镜头与节奏可直接逐帧对照","覆盖 3D 光场、相机运镜、LaTeX 排版等高级实战写法","配套作者本人的 Sublime 工作流与 checkpoint_paste 热重载技巧","许可证边界写得清楚：代码可学可用，内容禁商用"],limits:["不是工具/框架：没有统一入口、没有 CLI 封装、没有批处理","依赖 manimgl + 全量 TeX + 专用字体与音频，环境极重","场景强耦合同目录常量，单独拷出无法运行","CC BY-NC-SA 4.0 禁止商业使用"],compareTips:[{vs:"3b1b__manim",adviceZh:"manim 是引擎，videos 是内容；想跑起来先装 manimgl，想学镜头写法再读 videos"},{vs:"ManimCommunity__manim",adviceZh:"要稳定 API、跨平台与中文教程选 ManimCE；要 3b1b 同源 OpenGL 实时预览与官方素材选 ManimGL + videos"},{vs:"academa-labs__manimgx",adviceZh:"想开箱即用批量出片选 ManimGX；想亲手还原官方镜头细节，videos 无可替代"}],showcase:{demoBriefZh:"本批未出片（环境成本过高）。若演示，建议四段：①打开一个 2023 年场景文件，讲常量的组织方式；②manimgl -se 进入交互模式并 checkpoint_paste 改动一行；③渲染 Optics 的 3D 光场片段；④对照官方成片截图，标出同一镜头的源码位置",featureCallouts:[{titleZh:"官方生产源码",descZh:"与 3b1b 成片一一对应，不是教学 demo"},{titleZh:"3D 光场场景",descZh:"Optics 系列的相机与光场写法"},{titleZh:"checkpoint_paste",descZh:"热重载选中代码，保留场景状态"},{titleZh:"按年份归档",descZh:"从早期到 2023 之后的主题目录"},{titleZh:"明确许可边界",descZh:"CC BY-NC-SA，商用需另议"}]},evidence:[{field:"taglineZh",source:"README.md#L2-L4",noteZh:"仓库是 3b1b 视频的生成代码，几乎全部为 Manim 场景"},{field:"limits 第 2 条",source:"README.md#L6",noteZh:"老项目依赖旧版 manim，可能无法开箱运行"},{field:"limits 第 4 放链接",fit:"高度契合"},{scenarioZh:"CI 里记录安装过程",whoZh:"工程团队",whyZh:"命令行录制可脚本化，便于排查环境问题",deliverableZh:"构建日志式 .cast",fit:"适合"},{scenarioZh:"要交付 MP4 的场合",whoZh:"市场/课程团队",whyZh:"它不产视频，必须再接 agg 与 ffmpeg",deliverableZh:"需二次转换",fit:"勉强"},{scenarioZh:"Windows 本地录制",whoZh:"Windows 用户",whyZh:"官方明确不支持 Windows，建议改用 PowerSession",deliverableZh:"需替代工具",fit:"勉强"}],capabilities:{maxResolutionZh:"按终端列×行记录，像素尺寸由播放器字体决定；实测转出 1008×780",maxFpsZh:"记录事件时间戳而非固定帧率；转视频时由 agg/ffmpeg 决定，实测 100fps 时间基",durationZh:"无硬限制，取决于会话长度",effectsZh:["ANSI 颜色与光标控制","真实打字节奏与停顿","终端尺寸变化","播放器倍速/暂停/拖动"],audioZh:"不支持音频",interactivityZh:"播放器支持暂停、拖动、复制文本；录制端为实时交互",automationZh:"CLI 可脚本化：asciinema rec / play / cat / stream",assetsZh:"无素材概念，只记录终端事件流；字体由播放器决定",exportFormatsZh:[".cast（asciicast v2/v3）","经 agg 转 GIF","经 ffmpeg 转 MP4"],realtimePreviewZh:"有：播放器即回放；录制时可实时观看",ciFriendlyZh:"可进 CI（Linux PTY），但 Windows 不支持"},ceilingZh:"它的上限是“真实终端的完整还原”：任意 TUI、彩色输出、光标定位、窗口尺寸变化都能按原始时间轴回放，.cast 还是纯文本，能嵌网页、能搜索、能被程序解析。实测把一段真实 PowerShell 输出写成 cast v2，再经 agg 与 ffmpeg 转成 11.53 秒、1008×780 的 MP4，说明“cast → 视频”链路可行，但要多接两个工具。边界很清楚：它不产出视频，像素画面完全取决于播放器字体与主题；不支持音频；不支持 Windows（官方原文 Windows is currently not supported，依赖 Unix PTY），实测 Windows 上只能用 PowerSession 或手写 cast 绕过；直播需要服务器与网络；.cast 的“帧率”不是固定值，转视频时容易因事件稀疏而出现节奏问题。",workflow:[{stepZh:"安装",detailZh:"Linux/macOS 用包管理器或 pipx 安装 asciinema；Windows 需改用 PowerSession",effortZh:"约 3 分钟"},{stepZh:"录制",detailZh:"asciinema rec demo.cast，执行命令后 Ctrl-D 结束",effortZh:"按会话时长"},{stepZh:"回放检查",detailZh:"asciinema play demo.cast，检查节奏与输出是否完整",effortZh:"同上"},{stepZh:"发布/嵌入",detailZh:"asciinema upload，或把 .cast 与 player 放进网页",effortZh:"约 10 分钟"},{stepZh:"转视频",detailZh:"agg demo.cast demo.gif，再用 ffmpeg 转 MP4",effortZh:"约 1 分钟"}],differentiators:["记录的是真实终端事件流，.cast 是文本，可搜索、可 diff、可程序处理","网页播放器支持暂停、拖动与复制命令，体验优于视频","体积极小，一小时会话通常只有几百 KB","支持实时直播与自建服务器，不依赖第三方平台"],limits:["不产出视频，要 MP4 必须再接 agg 与 ffmpeg","官方不支持 Windows，依赖 Unix PTY","不支持音频，也没有镜头/字幕/转场","像素画质取决于播放器字体与主题，不适合高颜值宣传片"],compareTips:[{vs:"charmbracelet__vhs",adviceZh: ,whoZh:"创意开发者",whyZh:"3D 场景组件自带相机与灯光参数，省掉建模到渲染的胶水代码",deliverableZh:"10–20 秒 3D 片头",fit:"适合"},{scenarioZh:"源码级二次开发",whoZh:"组件库维护者",whyZh:"每个 bit 独立，可 fork 后改成自己品牌风格",deliverableZh:"定制组件包",fit:"适合"},{scenarioZh:"完整教学片",whoZh:"教师",whyZh:"完全没有 LaTeX/公式/字幕/配音链路，做不了数学讲解",deliverableZh:"不适用",fit:"勉强"}],capabilities:{maxResolutionZh:"由宿主 Remotion 的 Composition 决定；实测渲染 1280×720，理论可到 4K（受组件内固定像素参数影响）",maxFpsZh:"由 Composition 的 fps 决定；实测 30fps",durationZh:"由 Composition durationInFrames 决定；实测 5 秒 150 帧，组件本身不设时长上限",effectsZh:["MatrixRain 矩阵雨","粒子系统（Particles）","渐变/遮罩转场（MotionTransition）","Three.js 3D 场景与文字","颜色与运动底层工具"],audioZh:"依赖 Remotion 的音频组件（Audio/staticFile），组件库本身不提供配音与混音",interactivityZh:"Remotion Studio 实时预览与参数面板，无自有编辑器",automationZh:"Remotion CLI 渲染 + remotion-bits find/fetch/mcp 拉取单个 bit",assetsZh:"组件自带纹理与着色器；图片/视频素材通过 Remotion staticFile 提供",exportFormatsZh:["mp4（Remotion 渲染）","图片序列（Remotion still）"],realtimePreviewZh:"有，Remotion Studio 可拖时间轴",ciFriendlyZh:"中等：Remotion + three 依赖较重，跨目录引用在 Windows 需 junction"},ceilingZh:"它的天花板不是自己画片，而是把 Remotion 的复杂效果成本降下来：矩阵雨、粒子、Three.js 3D 场景都能直接挂进 Composition，配合渐变转场做 10–20 秒的高级感片头。但实测性能是硬约束：720p30 的 150 帧（5 秒）用了 86.9 秒，约 1.7fps，一分钟片子接近 20 分钟，4K 会更慢；3D 与粒子叠加时最吃性能。能力边界也很清楚：没有剧本编排、没有字幕、没有配音混流，这些都要宿主工程自己补；项目体量小（约 240 stars），文档仍在补全，demo 入口本身引用了未导出的 MotionTransition/Particles，跨目录引用在 Windows 还需 junction 才能解析。若宿主已用 Remotion，它能把 3D 与粒子的实现成本压到几行组件；没有 Remotion 时则一步都走不了。",workflow:[{stepZh:"确认宿主",detailZh:"先建 Remotion 工程（Node>=18、React>=18、Remotion>=4），组件必须跑在 Remotion 里",effortZh:"约 20 分钟"},{stepZh:"安装或单拉",detailZh:"npm install remotion-bits，或 npx remotion-bits find 3d cards 后 fetch 单个 bit",effortZh:"约 5 分钟"},{stepZh:"写 Composition",detailZh:"把组件放进 Sequence，按帧数调参；3D 组件需额外处理依赖解析",effortZh:"约 1 小时"},{stepZh:"Studio 预览",detailZh:"npx remotion studio 拖时间轴确认节奏与性能",effortZh:"约 10 分钟"},{stepZh:"渲染成片",detailZh:"npx remotion render 出 mp4；本次因 demo 缺组件，另建最小 entry 才成功",effortZh:"150 帧实测 87 秒"}],differentiators:["按 bit 粒度分发，CLI/MCP 可只拉需要的组件，不整包引入","自带 Three.js 3D 场景与粒子，不止文字动效","组件源码可读可改，适合二次开发成品牌素材","与 Remotion 生态无缝，可直接用其音频、字幕、批量渲染能力"],limits:["不是独立渲染器，离开 Remotion 工程完全不可用","实测 1.7fps，3D 与粒子叠加更慢","demo 入口引用未导出组件，照抄跑不起来","无配音、字幕、剧本编排，需宿主补齐"],compareTips:[{vs:"Remocn__remocn",adviceZh:"两者都是 Remotion 组件库；remotion-bits 偏 3D/粒子/矩阵雨，Remocn 偏 shadcn 风格界面与转场，按视觉需求组合使用"},{vs:"shadcn-labs__snapcn",adviceZh:"要 UI 质感组件选 snapcn；要粒子与 Three.js 大场景选 remotion-bits"},{vs:"remotion-dev__remotion",adviceZh:"Remotion 是引擎，bits 是插件；必须先有 Remotion 工程再谈 bits"}],showcase:{demoBriefZh:"四段：①MatrixRain 全屏背景 5 秒；②粒子场 + 渐变转场做片头；③Three.js 3D 文字推镜；④对比 720p 下加粒子前后的渲染耗时，说明 1.7fps 的成本",featureCallouts:[{titleZh:"MatrixRain",descZh:"可调密度、速度、字符集的矩阵雨"},{titleZh:"Particles",descZh:"粒子背景层，可叠在任意 Remotion 画面上"},{titleZh:"Three.js 场景",descZh:"3D 文字与空间卡片，自带相机参数"},{titleZh:"bit 级分发",descZh:"CLI find/fetch 与 MCP 单拉组件"},{titleZh:"MotionTransition",descZh:"渐变遮罩转场（官方 demo 中该导出缺失）"}]},evidence:[{field:"taglineZh",source:"README.md#L12",noteZh:"自述为 Remotion 专用组件与工具集合：文字特效、渐变转场、粒子、3D 场景"},{field:"differentiators 第 1 条",source:"README.md#L29-L44",noteZh:"CLI find/fetch 与 MCP 单拉 bit 的使用方式"},{field:"capabilities.maxFpsZh",source:"package.json#L37-L44",noteZh:"peer 依赖要求 React>=18、Remotion>=4、Node>=18"},{field:"limits 第 3 条",source:"_samples/av__remotion-bits/meta.json",noteZh:"demo 入口缺 MotionTransition/Particles 导出，改最小 entry 后 150 帧耗时 86880ms"}]},AzurIce__ranim:{id:"AzurIce__ranim",taglineZh:"纯 Rust 的 Manim 精神续作：代码描述动画，默认直出 1080p60 MP4",summaryZh:"Ranim 是纯 Rust 的动画引擎，API 思路来自 Manim 与 JAnim：用 Item 描述画面元素，用动画与缓动描述它们随时间的变化，运行时依赖 ffmpeg 把帧编码成 MP4。它解决“不想为动画装 Python、LaTeX 和一堆科学计算库”的问题——一个 cargo 工程、一条 render 命令，默认就产出 1920×1080、60fps 成片。与 Manim 相比它没有公式排版、3D 曲面与插件生态，优势在类型安全与原生性能。代价是生态极小、文档仍在写、首次编译要拉 900 多个 crate。它更像给程序员的动画 DSL，而不是给教师的课件工具。",whatItMakes:[{type:"数学/几何动画",exampleZh:"图形入场、变换、路径运动与缓动曲线演示",strength:"核心能力"},{type:"2D 概念讲解",exampleZh:"分步出现的图形、箭头、标注与场景切换",strength:"可用"},{type:"程序化动态图形",exampleZh:"用 Rust 循环批量生成图形阵列与运动",strength:"可用"},{type:"教学短片",exampleZh:"多场景串联，输出 1080p60 MP4",strength:"可用"}],useCases:[{scenarioZh:"Rust 技术演示视频",whoZh:"Rust 社区作者、系统工程师",whyZh:"全流程同一语言，不需要 Node/Python 运行时",deliverableZh:"1080p60 的 1–5 分钟 MP4",fit:"适合"},{scenarioZh:"几何/算法可视化",whoZh:"算法讲师、科普作者",whyZh:"用代码批量生成图形与运动，改参数即重渲",deliverableZh:"720p/1080p 短片",fit:"适合"},{scenarioZh:"Manim 迁移试验",whoZh:"想摆脱 Python 环境的团队",whyZh:"API 概念接近 Manim，但公式与 3D 能力缺失",deliverableZh:"2D 教学片段",fit:"勉强"},{scenarioZh:"CI 内生成动画",whoZh:"工程团队",whyZh:"cargo 构建可复现，render 命令可脚本化",deliverableZh:"固定模板的短动画",fit:"适合"}],capabilities:{maxResolutionZh:"默认 1920×1080，可通过 output 配置改分辨率；未声明上限",maxFpsZh:"默认 60fps；文档未声明更高帧率",durationZh:"由场景时长决定，无硬限制；实测 5 秒",effectsZh:["2D 图形与路径动画","缓动曲线与时间轴","场景切换与组合","代码生成的批量图形"],audioZh:"未见音频输入或音轨合成支持（未确认）",interactivityZh:"仅离线渲染，无交互播放器",automationZh:"CLI 可脚本化：cargo run --example 后执行 render <scene>",assetsZh:"以代码生成图形为主；字体/图片支持范围未确认",exportFormatsZh:["MP4"],realtimePreviewZh:"无（未确认）",ciFriendlyZh:"可进 CI：cargo 构建 + PATH 中的 ffmpeg，建议 GPU"},ceilingZh:"它把“默认质量”定得很高：render 不带参数就是 1920×1080、60fps、MP4，输出到 ./output/<scene>_1920x1080_60.mp4。实测 5 秒 300 帧在 RTX 4060 Laptop 上渲染 18.4 秒（约 16fps 出帧），wgpu 走 Vulkan，说明二维场景接近实时；但首次编译拉了 902 个 crate，耗时 6596 秒（约 1 小时 50 分），这是它最真实的门槛。边界：纯 2D，没有 3D 曲面与相机；没有 LaTeX 公式排版，数学课件的核心诉求它接不住；音频与字幕未见支持；文档是一本正在写的 book，示例数量远少于 Manim；没有可视化编辑器，复杂分镜全靠 Rust 代码。它的编译门槛极高，902 个 crate 首次构建近两小时；没有热重载，调一段动画要重跑编译，实际迭代效率不如 Manim 的 -ql 预览；社区示例也少。",workflow:[{stepZh:"安装",detailZh:"装 Rust 工具链与 ffmpeg 并确保在 PATH，克隆仓库",effortZh:"约 10 分钟"},{stepZh:"首次编译",detailZh:"cargo build 拉取 900+ crate，建议设 CARGO_HOME/CARGO_TARGET_DIR 到大盘",effortZh:"约 1–2 小时"},{stepZh:"写场景",detailZh:"参考 book/getting_started 与 examples，用 Item/动画 API 组织画面",effortZh:"首个场景 2–4 小时"},{stepZh:"渲染",detailZh:"cargo run --example hello_ranim，再执行 hello_ranim render hello_ranim",effortZh:"5 秒约 18 秒"}],differentiators:["纯 Rust 实现，无 Python/Node 运行时，类型安全且编译期可查错","默认 1080p60 MP4，不用手动挑质量档","wgpu 走 Vulkan/Metal，二维场景渲染接近实时","API 借鉴 Manim/JAnim，概念迁移成本低"],limits:["生态极小，文档与示例远少于 Manim，遇到问题难搜答案","首次编译 902 个 crate、约 1.8 小时，迭代环境 me 版本与虚拟时间策略敏感。CLI 与虚拟时间策略对 Chrome 版本很敏感。",whatItMakes:[{type:"产品发布/宣传片",exampleZh:"官网首屏、组件入场、CSS 关键帧转场",strength:"核心能力"},{type:"网页功能演示",exampleZh:"真实页面点击、滚动、弹窗、主题切换的录屏式动画",strength:"核心能力"},{type:"数据/Canvas 动画",exampleZh:"Canvas 2D 自绘帧、WebGL 着色器、粒子",strength:"可用"},{type:"带音轨的短片",exampleZh:"CLI 传 --audio 混入外部音乐，输出声画同步 MP4",strength:"可用"},{type:"可交互网页预览",exampleZh:"<helios-player> 嵌入网页播放并 scrub",strength:"核心能力"}],useCases:[{scenarioZh:"官网改版宣传片",whoZh:"品牌/前端团队",whyZh:"官网现成 CSS 动画直接录，不用重写一套视频代码",deliverableZh:"1080p30 的 15–45 秒 MP4",fit:"高度契合"},{scenarioZh:"产品功能 Demo",whoZh:"产品经理、售前",whyZh:"真实页面操作序列可脚本化，画面与线上一致",deliverableZh:"720p/1080p 功能演示 1–3 分钟",fit:"适合"},{scenarioZh:"设计师动效提案",whoZh:"UI/动效设计师",whyZh:"直接交付 CSS 关键帧作品，导出成可评审视频",deliverableZh:"短动效 10–30 秒，多版本对比",fit:"适合"},{scenarioZh:"批量社媒切片",whoZh:"内容运营",whyZh:"一套 HTML 模板改文案与配色批量渲染",deliverableZh:"9:16/1:1 多尺寸短片",fit:"勉强"},{scenarioZh:"无头录制进 CI",whoZh:"工程团队",whyZh:"CLI + composition.html 可脚本化，产物稳定",deliverableZh:"每次发版自动生成演示视频",fit:"适合"}],capabilities:{maxResolutionZh:"由 composition 定义，README 示例 1920×1080；无全局上限声明，实测 1280×720",maxFpsZh:"由 composition 的 fps 决定，示例 30fps；未声明硬上限",durationZh:"由 composition 的 duration 决定，无框架级时长限制",effectsZh:["原生 CSS @keyframes 与过渡","Web Animations API 逐帧 seek","Canvas 2D / WebGL 自绘帧","任意 HTML 页面 renderAt(t) 回调"],audioZh:"CLI 支持 --audio 传入外部音轨；不内置 TTS",interactivityZh:"提供 <helios-player> Web Component 交互预览；成片为离线 MP4",automationZh:"CLI 可脚本化：npx @helios-project/cli render composition.html -o out.mp4",assetsZh:"任意网页素材（图片/字体/视频/音频）；无内置模板或主题库",exportFormatsZh:["MP4"],realtimePreviewZh:"有：Player 组件与浏览器实时预览",ciFriendlyZh:"可进 CI；需 Chrome 与 CDP，GPU 建议开启"},ceilingZh:"它最强的地方是“任何会自己画帧的网页都能录”：不导入 Helios 也行，只要页面暴露 renderAt(t)，CLI 就能逐帧调用并编码。实测在 Windows 用 Playwright 打开 examples/simple-canvas-animation，每帧写 window.__HELIOS_VIRTUAL_TIME__ 推进时间，5 秒 720p30 渲染约 91 秒，WebGL 走 ANGLE/Vulkan（RTX 4060 Laptop），瓶颈在逐帧截图与合成，不在动画计算。边界：CLI 与虚拟时间策略对 Chrome 版本敏感，Windows 直接跑 CLI 未验证通过；项目 beta，API 会变；许可证是 Elastic License 2.0，不是 OS rs 可单独复用"},{titleZh:"Agent 流程",descZh:"SKILL 规定决策边界"}]},evidence:[{field:"stars",source:"GitHub API",noteZh:"30,559 stars"},{field:"结构",source:"本地实测",noteZh:"helpers/ + skills/manim-video，Python 为主"},{field:"样例",source:"本地实测",noteZh:"SAPI 配音 + 手写时间轴 + 2 段裁切/调色/烧字幕，7.04s/1280×720/30fps 出片（libass 步骤手工补跑）"}]},charmbracelet__vhs:{id:"charmbracelet__vhs",taglineZh:"用 .tape 脚本写终端录屏：打字、等待、按键都可复现，直接输出 GIF/MP4",summaryZh:"VHS 是 Charmbracelet 的终端录屏工具，把“录一个 CLI 演示”变成写脚本：.tape 里用 Type、Enter、Sleep、Set Width/FontSize/Theme 等指令描述一次会话，VHS 在虚拟终端里执行并录制，最后由 ffmpeg 编码成 GIF、MP4 或 WebM。它解决终端演示“手动录、重录、剪不齐”的问题。与 asciinema 的“录真实会话再回放”不同，VHS 是声明式重演；与屏幕录制相比，它能精确控制打字速度、停顿与主题。代价是依赖 ttyd + ffmpeg + Chrome。Linux、macOS 与 Docker 是它的舒适区；Windows 上官方链路基本不可用，要另找终端桥接。",whatItMakes:[{type:"CLI 工具演示 GIF",exampleZh:"neofetch、git 操作、安装脚本的逐字输入与输出",strength:"核心能力"},{type:"终端交互短片",exampleZh:"分屏、隐藏/显示光标、窗口栏、主题切换",strength:"核心能力"},{type:"集成测试快照",exampleZh:"CI 里重放 tape，检查终端输出是否变化",strength:"可用"},{type:"文档/README 动图",exampleZh:"固定 1200×600、46px 字体的品牌化 GIF",strength:"核心能力"},{type:"MP4/WebM 素材",exampleZh:"Output 指定 .mp4 或 .webm，交给视频剪辑",strength:"可用"}],useCases:[{scenarioZh:"开源 CLI 的 README 演示",whoZh:"开源作者",whyZh:"tape 脚本可版本管理，改命令重录，风格统一",deliverableZh:"GIF 或 MP4，10–20 秒",fit:"高度契合"},{scenarioZh:"终端产品发布视频",whoZh:"DevTools 团队",whyZh:"精确控制打字节奏与停顿，画面干净无录屏软件水印",deliverableZh:"1080p 级 MP4 片段",fit:"适合"},{scenarioZh:"CI 视觉回归",whoZh:"工程团队",whyZh:"同一条 tape 每次产出相同帧，可做快照对比",deliverableZh:"GIF/截图基线",fit:"适合"},{scenarioZh:"教学材料制作",whoZh:"讲师、课程作者",whyZh:"把命令演示标准化，避免现场手滑",deliverableZh:"分步 GIF，嵌入课件",fit:"适合"},{scenarioZh:"Windows 本地生产",whoZh:"Windows 创作者",whyZh:"官方有 scoop/winget 包，但实测 ttyd 在 Windows 上 WebSocket 1006，链路不通",deliverableZh:"需替代方案",fit:"勉强"}],capabilities:{maxResolutionZh:"由 Set Width/Height 决定，示例 1200×600；实测输出 1280×720",maxFpsZh:"由 ffmpeg 编码决定，常用 30fps；实测 30fps",durationZh:"无硬限制，取决于 Tape 里的 Sleep 与命令时长；实测 13.6 秒",effectsZh:["逐字 Type 与按键序列","Sleep 精确停顿","隐藏/显示终端元素","主题、字体、窗口栏、边距"],audioZh:"不支持音频，产物为无声终端画面",interactivityZh:"无交互，按 tape 脚本确定性重演",automationZh:"CLI 可脚本化：vhs demo.tape，可进 CI；依赖 ttyd 与 ffmpeg",assetsZh:"字体与主题通过 Set 指令指定；无图片素材概念",exportFormatsZh:["GIF","MP4","WebM","PNG 截图"],realtimePreviewZh:"无实时预览窗口；录完直接看文件",ciFriendlyZh:"可进 CI（Docker 镜像自带依赖），Linux 上稳定，Windows 需绕路"},ceilingZh:"它能把任何 CLI 操作录成像素级可控的演示：实测 13.6 秒、1280×720、30fps、408 帧的片子，打字、停顿、清屏、分屏都能写进 tape；配合 Theme、FontSize、WindowBar、Padding 可以做出品牌化的终端窗口。上限不在画面复杂度，而在“只能是终端”：没有音频、没有字幕、没有镜头运动，也不适合录 GUI。工程边界更明显：必须装 ttyd 与 ffmpeg，VHS 通过 Chrome 里的 WebSocket 终端桥接，Windows 实测 ttyd 1.7.7 在握手后立即 1006，vhs 永远等不到 xterm 文本层，官方链路失败；Linux/macOS 与 Docker 才是它的舒适区。实测 Windows 上 ttyd 在握手后立即断开，vhs 等不到终端文本层，只能用 WSL 或 Docker 绕过；另外 GIF 体积随分辨率与时长迅速膨胀，长演示要改用 MP4。",workflow:[{stepZh:"安装依赖",detailZh:"装 ttyd 与 ffmpeg，再装 vhs（brew/scoop/二进制/go install 均可）",effortZh:"约 10 分钟"},{stepZh:"写 tape",detailZh:"Output/Settings 加 Type、Sleep、Enter、Ctrl 等指令，描述一次完整会话",effortZh:"约 20 分钟"},{stepZh:"试录",detailZh:"vhs demo.tape，检查字体、主题、停顿节奏与窗口尺寸",effortZh:"每次 10–60 秒"},{stepZh:"调优",detailZh:"改 TypingSpeed、PlaybackSpeed、Padding，必要时加 Hide/Show 清理画面",effortZh:"多轮迭代"},{stepZh:"进 CI",detailZh:"用 ghcr.io/charmbracelet/vhs 镜像重放，或把 GIF 作为文档资产提交",effortZh:"约半小时"}],differentiators:["声明式 tape 脚本，终端演示可版本管理、可确定性重放","精确到毫秒的打字与停顿控制，比人手录屏稳定","主题、字体、窗口栏、边距都能设，产物风格统一","官方 Docker 镜像自带 ttyd/ffmpeg，CI 复现简单"],limits:["只能录终端，做不了 GUI、网页与 3D 画面","强依赖 ttyd + ffmpeg + Chrome 桥接，Windows 实测链路失败","不支持音频与字幕，GIF 体积也容易偏大","没有可视化编辑器，复杂分屏要读文档试参数"],compareTips:[{vs:"asciinema__asciinema",adviceZh:"要录真实会话、可回放可嵌入网站选 asciinema；要确定性重演与品牌化 GIF 选 VHS"},{vs:"asciinema__agg",adviceZh:"已有 .cast 想转 GIF 用 agg；从零设计一段终端演示用 VHS 的 tape 更直接"},{vs:"LBEILC__Multiplane",adviceZh:"要网页/终端混合画面选 Multiplane；纯终端演示 VHS 更轻"}],showcase:{demoBriefZh:"四段：①写一个含 Type/Sleep/Enter 的 tape；②展示 ttyd + Chrome 桥接的虚拟终端执行；③分屏与主题切换的成品 GIF；④用 ffprobe 展示 1280×720/30fps/408 帧的 MP4",featureCallouts:[{titleZh:"Tape 脚本",descZh:"一次会话写成可复现文件"},{titleZh:"逐字打字",descZh:"TypingSpeed 可精确控制打字节奏"},{titleZh:"主题与字体",descZh:"终端窗口可做品牌化主题"},{titleZh:"GIF/MP4/WebM",descZh:"一条 Output 决定成片格式"},{titleZh:"Docker 复现",descZh:"Docker 镜像自带 ttyd 与 ffmpeg"}]},evidence:[{field:"taglineZh",source:"README.md#L12-L16",noteZh:"自述 Write terminal GIFs as code for integration testing and demoing"},{field:"limits",source:"README.md#L75-L78",noteZh:"明确 VHS 依赖 ttyd 与 ffmpeg，且需在 PATH"},{field:"capabilities.effectsZh",source:"command.go#L40-L73",noteZh:"命令映射含 type/sleep/ctrl/alt/shift/screenshot/copy/paste/env/wait 等"},{field:"ceilingZh",source:"_samples/charmbracelet__vhs/meta.json",noteZh:"官方链路在 Windows 上 ttyd 1006 失败；兜底模拟产出 1280×720/30fps/13.6s/408 帧"}]},codedbytahir__motionforge:{id:"codedbytahir__motionforge",taglineZh:"带可视化时间轴的 Next.js 视频工作台，动画组件复用 Remotion，天然能拍电影感",summaryZh:"一个 Web 视频编辑器原型：Next.js + React 19 + Prisma 做工程与界面，渲染与时间轴跑在 Remotion 上，v2.0 又加了一套「Cinematic Suite」——动力学排版、液态文字、3D 文字堆叠、景深画廊、Perlin 噪声转场、抖动效果、FLIP 图片展开、圆形遮罩。它想解决的是「写代码太慢、拖时间轴又太弱」，于是把两者放进同一个浏览器应用。但它没有导出 CLI：本次靠自建 Vite 宿主 + Playwright 逐帧截图才拿到 880×532 的 10 秒成片，装依赖拉了 1001 个包，两次都超时。它的价值在组件库，而不是工程完整性。",whatItMakes:[{type:"电影感动效标题",exampleZh:"KineticTypography 速度驱动的字距错位、LiquidText 液态填充标题",strength:"核心能力"},{type:"3D 场景与景深",exampleZh:"DepthGallery3D 的雾化景深画廊、TextStack3D 多层透视文字",strength:"核心能力"},{type:"Shader 转场",exampleZh:"Perlin 噪声阈值揭示、Ordered/Floyd-Steinberg 抖动",strength:"可用"},{type:"图片展开/遮罩",exampleZh:"FLIP 缩略图到全屏、圆形 SVG 遮罩聚焦",strength:"可用"},{type:"可视化时间轴剪辑",exampleZh:"浏览器内多轨预览、拖拽调整图层顺序与时长",strength:"可用"},{type:"批量长片生产",exampleZh:"无导出 CLI、无队列，实测 300 帧要 40 分钟",strength:"受限"}],useCases:[{scenarioZh:"团队自建 Web 剪辑器",whoZh:"SaaS 产品团队",whyZh:"已有编辑器 UI + Remotion 渲染 + 组件库，是最接近产品化的开源底子",deliverableZh:"可运行的编辑器应用，导出需自接",fit:"高度契合"},{scenarioZh:"动效模板演示片",whoZh:"视觉设计师、创意开发",whyZh:"Cinematic 组件成套，改文案即可产出高级感片段",deliverableZh:"10 秒 880×532 MP4（实测尺寸）",fit:"适合"},{scenarioZh:"内部营销短片",whoZh:"内容团队",whyZh:"浏览器里拖时间轴比写代码快，但缺少稳定导出链路",deliverableZh:"需自建导出脚本",fit:"勉强"},{scenarioZh:"组件二次开发",whoZh:"前端开发者",whyZh:"9 个 Cinematic 组件源码可读，可抽出来单独用",deliverableZh:"定制组件与 Composition",fit:"适合"},{scenarioZh:"CI 自动批量出片",whoZh:"工具链团队",whyZh:"安装 1001 个包、无 CLI、渲染 8 秒/帧，不适合自动化",deliverableZh:"不适用",fit:"勉强"}],capabilities:{maxResolutionZh:"由宿主 Composition 决定；实测 880×532，Remotion 理论可到 4K，但组件内固定像素参数需逐个改",maxFpsZh:"实测 30fps；由 Remotion Composition 配置，可改 60",durationZh:"由时间轴决定；实测 10 秒 300 帧。无硬上限，但渲染时间线性增长",effectsZh:["KineticTypography 速度驱动排版","LiquidText 液态填充","TextStack3D 3D 文字","DepthGallery3D 景深画廊","ShaderImageReveal Perlin 转场","DitheringEffect 抖动","FlipImageReveal FLIP 展开","CardExpansionMask 遮罩"],audioZh:"编辑器带媒体面板，但音频混流未确认；导出链路以截帧为主，不保证音轨",interactivityZh:"强：可视化时间轴、图层拖拽、实时预览，是面向人工剪辑的界面",automationZh:"弱：无官方导出 CLI；本次自建 Vite + Playwright 逐帧截图后才出片",assetsZh:"媒体面板支持本地上传图片/视频；无内置素材库与 TTS",exportFormatsZh:["mp4（经 Remotion 或截帧合成）","png 帧序列"],realtimePreviewZh:"有，编辑器内 Remotion 预览",ciFriendlyZh:"弱：依赖数据库与 1001 个包，安装两次均超时"},ceilingZh:"从设计看它的上限不低：9 个 Cinematic 组件覆盖排版、3D、shader、FLIP、遮罩，配 Remotion 可做真正有电影感的 10–30 秒片。但实测把上限压得很低：本次 880×532、300 帧、10 秒的片子走了 40 分钟，约 8 秒/帧，批量出片基本不可能；4K 未验证，组件内写死的像素参数还要逐个适配。最复杂的效果是 DepthGallery3D（Three.js 景深 + 雾）与 Perlin 噪声转场叠加。边界：没有导出 CLI，必须自己接 Remotion 或截图管线；pnpm 安装 1001 个包两次超时；README 无在线 demo，97 stars 的社区几乎无处提问；Prisma 数据库是启动前置条件。另外它的组件依赖 Three.js 与 Remotion 运行时，想单独复用要先拆掉编辑器与数据库那层。短片段、单人制作、本机预览是它目前唯一能跑通的范围。",workflow:[{stepZh:"安装依赖",detailZh:"pnpm install；实测 1001 个包两次均超时，建议加长超时或分步装",effortZh:"20–60 分钟"},{stepZh:"配数据库",detailZh:"按 README 配 Prisma 与 .env，否则应用起不来",effortZh:"约 20 分钟"},{stepZh:"启动编辑器",detailZh:"pnpm dev 打开浏览器，新建工程并拖入媒体",effortZh:"首编译约数分钟"},{stepZh:"编排时间轴",detailZh:"在时间轴上放 Cinematic 组件，调时长、图层顺序与参数",effortZh:"按片长而定"},{stepZh:"导出",detailZh:"无官方 CLI；本次用自建 Vite 宿主 + Playwright 逐帧截图，再 ffmpeg 合成",effortZh:"300 帧约 40 分钟"}],differentiators:["编辑器与代码双模：可视化时间轴 + Remotion 组件，兼顾拖拽与编程","Cinematic Suite 九个成品组件，省掉 shader 与 3D 的底层实现","Next.js + Prisma 的完整应用骨架，接近可直接商用的剪辑 SaaS 底子","FLIP 展开与 SVG 遮罩这类细节组件在开源里少见"],limits:["没有官方导出 CLI，成片链路要自己搭","安装极重（1001 包，两次超时），启动还依赖数据库","实测约 8 秒/帧，10 秒片要 40 分钟，无法批量","文档缺在线 demo，社区小，问题基本无处查"],compareTips:[{vs:"openvideodev__react-video-editor",adviceZh:"要纯浏览器 Pixi + WebCodecs 的编辑器选 react-video-editor；要多轨 + Remotion 组件生态选 motionforge，但两者导出链路都不完整"},{vs:"remotion-dev__remotion",adviceZh:"Remotion 是可靠引擎但无编辑器；motionforge 提供编辑器与组件，稳定性差很多，适合做原型不适合量产"},{vs:"motion-canvas__motion-canvas",adviceZh:"Motion Canvas 有成熟的代码 + 编辑器工作流；motionforge 更偏 Next.js 应用与 Cinematic 组件"}],showcase:{demoBriefZh:"四段：①编辑器时间轴上放 KineticTypography 标题，拖时长看实时预览；②DepthGallery3D 景深画廊 + 相机推进；③ShaderImageReveal 的 Perlin 转场与抖动效果对比；④展示导出流程：自建宿主、逐帧截图、ffmpeg 合成，并标注 8 秒/帧的耗时",featureCallouts:[{titleZh:"KineticTypography",descZh:"速度驱动的字符错位与有机运动"},{titleZh:"DepthGallery3D",descZh:"距离雾 + 景深的 3D 画廊"},{titleZh:"ShaderImageReveal",descZh:"Perlin 噪声阈值揭示转场"},{titleZh:"FlipImageReveal",descZh:"FLIP 缩略图到全屏的无缝展开"},{titleZh:"可视化时间轴",descZh:"浏览器内拖拽图层与时长"}]},evidence:[{field:"taglineZh",source:"README.md#L9",noteZh:"自述为 React/Next.js/WebGL 的程序化视频框架，确定性逐帧渲染"},{field:"capabilities.effectsZh",source:"README.md#L13-L31",noteZh:"v2.0 Cinematic Suite 九个组件的完整清单"},{field:"limits 第 3 条",source:"_samples/codedbytahir__motionforge/meta.json",noteZh:"实测 300 帧 880×532，耗时 40 分钟，约 8 秒/帧"},{field:"limits 第 1 条",source:"README.md#L36-L44",noteZh:"README 只给 create-motionforge 与组件用法，未提供导出 CLI 说明"}]},cth9191__animate:{id:"cth9191__animate",taglineZh:"Claude Code 技能包：用 canvas 代码画分镜、配音配乐，直接渲出竖屏短视频",summaryZh:"这不是 npm 库，而是一个 Claude Code 技能：把选题、故事节拍、画风、配音、配乐、渲染串成一条流水线，画面全部由 canvas 代码逐帧绘制，再用 headless Chromium 截图、ffmpeg 合成 MP4。它把七种内置画风（剪纸、交叉排线、孔版印刷、速写本、math、像素、等距）连同「故事语法」一起交付，每一种风格都是一套可插拔的绘图套件。与通用动画框架最本质的区别在于：它规定的是叙事节奏与画面规则，而不是给你一堆 API 自己拼。实测 1080×1920、24fps、144 帧带音轨，21.8 秒出片。",whatItMakes:[{type:"数学讲解动画",exampleZh:"math 风格：黑底坐标轴、彩色变量、公式逐步推演，接近 Manim 观感",strength:"核心能力"},{type:"竖屏知识/科普短片",exampleZh:"剪纸、孔版、速写本、像素、等距五种画风的讲解片与历史时间线",strength:"核心能力"},{type:"多比例一次出片",exampleZh:"9:16、1:1、4:5、16:9 各按版式重排，不是裁切",strength:"核心能力"},{type:"带旁白的口播视频",exampleZh:"脚本分句、逐词对时，ElevenLabs 或自录音频驱动画面节奏",strength:"可用"},{type:"自定义画风仿制",exampleZh:"给参考视频或网页，量出色板、线宽、纹理、运镜后生成新风格目录",strength:"可用"},{type:"长片分段并行构建",exampleZh:"长片按场景拆分，一个场景一个文件，由 build 合并（README 标注为并行构建）",strength:"受限"}],useCases:[{scenarioZh:"竖屏知识短视频",whoZh:"独立创作者、知识类运营",whyZh:"从选题到成片在同一个会话里完成，剪辑与调色步骤被省掉",deliverableZh:"1080×1920 24fps MP4，单条 6–60 秒，含配音与配乐",fit:"高度契合"},{scenarioZh:"中学/大学数学课件",whoZh:"教师、课程制作团队",whyZh:"math 风格自带坐标轴与公式排版规则，不用懂 Manim 也能出片",deliverableZh:"16:9 1080p MP4，单条 3–8 分钟（需按场景拆分）",fit:"适合"},{scenarioZh:"品牌科普与产品短片",whoZh:"内容营销团队",whyZh:"可截图真实产品页并把界面动起来，四种比例一次导出",deliverableZh:"20–45 秒多比例 MP4 套件",fit:"适合"},{scenarioZh:"历史/传记时间线视频",whoZh:"教育频道、出版机构",whyZh:"故事语法内置「按时间线串联、形变转场」结构，示例就是 60 秒 15 个时代",deliverableZh:"60 秒剪纸风 MP4，13 次形变转场",fit:"高度契合"},{scenarioZh:"需要精细卡点的广告片",whoZh:"专业后期团队",whyZh:"节奏由故事节拍表与音乐拍点共同驱动，但缺少逐帧手工微调界面",deliverableZh:"15–30 秒成片",fit:"勉强"}],capabilities:{maxResolutionZh:"默认 1080×1920 竖屏；横屏与其他尺寸需改配置，实测导出 1080×1920",maxFpsZh:"实测 24fps 输出（144 帧 6 秒）；渲染按帧逐张截图，帧率由配置决定",durationZh:"面向短视频，常见 20–60 秒；官方示例为 60 秒，更长需按场景拆分并行构建",effectsZh:["七种内置画风套件（剪纸/交叉排线/孔版/速写本/math/像素/等距）","形变转场（旧世界收束到物体再展开）","闭式弹簧动画与可选运动模糊","相机运动与世界坐标映射","节拍网格剪辑与响度检查"],audioZh:"TTS 配音（ElevenLabs 连接器或自录）、代码合成配乐、stems 分轨与音效，faster-whisper 逐词对齐；脚本自动分句",interactivityZh:"生成可交互的 index.html，支持点击听声与 ?t=12.5 定格单帧；无时间轴编辑器",automationZh:"build/still/storyboard/export/review 等 .mjs 工具可单独调用，但整套流程依赖 Claude Code 会话与三次人工确认",assetsZh:"系统字体（含 Windows 回退）、参考图/参考视频、产品截图、用户音乐；无内置图库",exportFormatsZh:["mp4（多比例批量）","wav/stems 音频中间件","png 单帧与拼图"],realtimePreviewZh:"浏览器打开 index.html 实时预览，playwright 抓 still 帧做审片",ciFriendlyZh:"较弱：无 package.json 与统一入口，需手动按路径调用脚本，且流程依赖对话式确认"},ceilingZh:"官方给出的能力上限就是那条 60 秒剪纸风示例：15 个时代、13 次形变转场、一次硬切卡在情绪最高点、全程代码合成配乐。实测 144 帧 24fps 导出 21.8 秒，约 0.15 秒/帧，按此推算 60 秒（1440 帧）约 3.6 分钟，批量出四种比例则是四倍。画质上限是 1080 宽，4K 未确认；最复杂的效果是「自定义画风」：喂参考视频或网页，量出色板、线宽、纹理与剪辑节奏后生成新风格目录，并保证同一套 kit 改动后帧哈希不变。边界：依赖 Claude Code 宿主和人工审美确认，WebGL 风格仍标注为 Coming；没有字幕渲染器，字幕只能画进画面；音轨与画面时长不一致时 ffmpeg 混流会直接报错。这类片子更像手工定制，不适合日更批量。",workflow:[{stepZh:"安装",detailZh:"通过 /plugin marketplace 安装 animate，或把 skills/animate 拷到 ~/.claude/skills；另装 Playwright Chromium 与 ffmpeg",effortZ ,{field:"ceilingZh",source:"_samples/cth9191__animate/meta.json",noteZh:"实测 1080×1920/24fps/144 帧，21.8s，912171 字节，带音轨"}]},"dmnsgn__canvas-record":{id:"dmnsgn__canvas-record",taglineZh:"一个 Recorder 七种编码器：把 canvas 录成 MP4、MKV、GIF 或图片序列的模块化库",summaryZh:"浏览器端的 Canvas 录制库，用 WebCodecs 为主、Wasm 编码器为备，把 2D/WebGL/WebGPU canvas 逐帧录成 mp4、webm、mkv、mov、gif 或 png/jpg 序列。它的设计是「编码器可热换」：同一个 Recorder 只换 encoderOptions 就能改容器，WebCodecs 比 H264MP4Encoder 快 5–10 倍、比 FFmpeg wasm 快约 20 倍。与 ccapture.js 相比格式覆盖更全、类型更完整，但编码吞吐慢一个量级，而且是裸 ES 模块，页面必须配 import-map 才能跑。实测 720p 120 帧 29.5 秒。它还能用 File System Access 边录边写本地文件，不把整段视频堆在内存里；TypeScript 类型完整，适合需要长期维护的工程项目。",whatItMakes:[{type:"WebGL/WebGPU 生成艺术",exampleZh:"Three.js 或 WebGPU 场景逐帧 step() 录制，换编码器即可改容器",strength:"核心能力"},{type:"多格式交付",exampleZh:"同一段动画出 mp4、webm、mkv、mov、gif 与图片序列",strength:"核心能力"},{type:"图片序列给后期",exampleZh:"Frame 编码器输出 png/jpg 或 zip，交给 AE/ffmpeg 精修",strength:"核心能力"},{type:"GIF 动图",exampleZh:"GIF 编码器直出循环动图，适合文档与网页",strength:"可用"},{type:"4K/8K 高分辨率导出",exampleZh:"超 AVC 帧上限时改用 Frame 编码器，再用 ffmpeg CLI 合成",strength:"受限"},{type:"实时屏幕录制",exampleZh:"MediaCapture 编码器按 1x 实时录 canvas 流",strength:"受限"}],useCases:[{scenarioZh:"Three.js 作品导出视频",whoZh:"前端 3D 开发者、创意工作室",whyZh:"作品已在浏览器，Recorder 逐帧推进即可录，不必改动画逻辑",deliverableZh:"4 秒 1280×720 30fps MP4，约 2.45MB",fit:"高度契合"},{scenarioZh:"产品 demo 加录制按钮",whoZh:"SaaS 前端团队",whyZh:"模块化 API 易嵌进现有应用，格式可按用户需求切换",deliverableZh:"GIF 或 mp4 分享文件",fit:"适合"},{scenarioZh:"教学 canvas 动画转 GIF",whoZh:"教师、课程制作者",whyZh:"GIF 编码器直出，无需外部转码",deliverableZh:"3–8 秒教学 GIF",fit:"适合"},{scenarioZh:"4K/8K 高分辨率交付",whoZh:"广告与影视外包",whyZh:"AVC 帧上限约 4K 16:9，超大尺寸必须走图片序列",deliverableZh:"8K png 序列 + ffmpeg 合成",fit:"勉强"},{scenarioZh:"CI 自动出片",whoZh:"工具链维护者",whyZh:"无 CLI，需要宿主页与 Playwright，且编码慢",deliverableZh:"自动化产出的 mp4",fit:"勉强"}],capabilities:{maxResolutionZh:"WebCodecs 与 FFmpeg 的 AVC 单帧上限 9437184 像素，约 4K 16:9@30；4K 方形或 8K 需改用 Frame 编码器再外部合成",maxFpsZh:"由 step() 调用频率与编码器吞吐决定；实测 720p 约 4.1fps 编码吞吐",durationZh:"无硬上限，受内存与编码队列约束；可边录边写文件系统（File System Access）",effectsZh:["无内置特效，只负责录制","支持 2D / WebGL / WebGPU canvas","7 种编码器可热换","可写浏览器或本地文件系统"],audioZh:"本次未确认音轨 API；README 的编码器表未提供音频说明",interactivityZh:"纯 JS API，无编辑器；需自己实现录制按钮与状态 UI",automationZh:"无 CLI；需宿主页 + Playwright，本次实测即用固定 step 次数（RecorderStatus 未导出导致状态判断失效）",assetsZh:"无内置素材；输入就是一块 canvas，输出交给浏览器下载或文件系统",exportFormatsZh:["mp4（WebCodecs、MP4Wasm、H264MP4、FFmpeg）","webm","mkv","mov","gif","png/jpg 序列与 zip"],realtimePreviewZh:"录制时页面照常渲染；MediaCapture 编码器可 1x 实时录流",ciFriendlyZh:"中等：Chromium 可用，但无封装命令且编码慢"},ceilingZh:"格式覆盖是它最强的一档：同一段动画换 7 种编码器就能出 mp4/webm/mkv/mov/gif/图片序列，还能直接写本地文件系统绕开浏览器内存。速度对照 README 的官方结论：WebCodecs 比 H264MP4Encoder 快 5–10 倍、比 FFmpeg wasm 快约 20 倍；但实测 720p 120 帧仍要 29.5 秒（4.1fps），比 ccapture.js 慢约 8.5 倍，一分钟 30fps 片子接近 12 分钟。分辨率硬上限是 AVC 单帧 9437184 像素（约 4K 16:9），4K 方形或 8K 必须换 Frame 编码器再跑 ffmpeg CLI，官方给了现成命令。边界：无音轨与字幕管线、无时间轴、无 CLI；RecorderStatus 未从入口导出，按状态判断容易只录 1 帧，本次只能固定 step 次数。如果只是把一段 720p 动画发到群里，它并不是最省时的选择：格式多换来的是成倍的时间成本。",workflow:[{stepZh:"安装",detailZh:"npm install canvas-record；页面需配 import-map 解析裸模块，否则报解析失败",effortZh:"约 10 分钟"},{stepZh:"准备画布",detailZh:"用 canvas-context 或现有 renderer 拿到 2D/WebGL/WebGPU context",effortZh:"约 15 分钟"},{stepZh:"配置 Recorder",detailZh:"new Recorder(context, {name, encoderOptions:{codec}})，按需换 encoder 决定容器",effortZh:"约 20 分钟"},{stepZh:"逐帧推进",detailZh:"start() 后循环 render() + await step()，固定次数循环最稳",effortZh:"约 20 分钟"},{stepZh:"落盘",detailZh:"stop() 拿 Blob 触发下载，或用 File System Access 直接写文件",effortZh:"约 10 分钟"}],differentiators:["编码器与容器解耦，7 种编码器可热换而不改录制逻辑","支持 WebGPU canvas 并可直接写本地文件系统","4K/8K 有官方绕法：Frame 编码器 + ffmpeg CLI 现成命令","WebCodecs 主路径比 Wasm 编码器快 5–20 倍"],limits:["实测仅 4.1fps（720p），长片编码极慢","裸 ES 模块，不配 import-map 直接报错","无音轨、字幕与时间轴，不是剪辑工具","RecorderStatus 未导出，官方 demo 的状态判断容易失效"],compareTips:[{vs:"spite__ccapture.js",adviceZh:"要 mkv/mov/图片序列、WebGPU 与类型提示选 canvas-record；只求快、求老项目兼容，ccapture 实测快约 8 倍"},{vs:"wx4766__html-to-video",adviceZh:"要录整页 DOM 与 CSS 动画选 html-to-video；只录 canvas 内容选 canvas-record"},{vs:"ybouane__VideoFlow",ad n 工具让模型能自检画面",deliverableZh:"模板化 30–120 秒短片",fit:"适合"},{scenarioZh:"品牌动态图形",whoZh:"动效设计师（有 Rust 基础）",whyZh:"SVG 设计稿思路可直接翻译成代码，GPU 渲染快",deliverableZh:"15–60 秒品牌片，多尺寸",fit:"勉强"},{scenarioZh:"批量模板渲染",whoZh:"内容工作室",whyZh:"cargo 工程化，render 可脚本化，draft 模式快速迭代",deliverableZh:"每日批量 720p 草稿 + 1080p 成片",fit:"适合"},{scenarioZh:"Windows 本地部署",whoZh:"个人创作者",whyZh:"需要 MSVC、FFmpeg 开发库、Skia 预编译包与 libclang，环境门槛高",deliverableZh:"本地出片环境",fit:"勉强"}],capabilities:{maxResolutionZh:"由 Video trait 的 WIDTH/HEIGHT 常量决定；示例 1920×1080，无文档上限",maxFpsZh:"由 FPS 常量决定，示例 30fps",durationZh:"由 duration() 返回，示例 30 秒；官方演示片 128 秒",effectsZh:["SVG 矢量图形与文字","时间轴插值与缓动","SkSL/Shadertoy GLSL 图层","Skia GPU 合成（Metal/Vulkan）"],audioZh:"AudioMap 挂外部音轨，audio analyze 报 LUFS、真峰值、削波与静音段；不内置 TTS",interactivityZh:"仅离线渲染；preview 打开 GPU 窗口可播放、暂停、seek、逐帧步进",automationZh:"cargo run --release -- render，可加 --draft 半分辨率快速出片，可 --json 输出",assetsZh:"字体与图片走工程目录；inspect 会报缺字体/缺图片/文字出界",exportFormatsZh:["MP4","PNG 帧","PNG 拼图 contact sheet"],realtimePreviewZh:"有：preview 窗口；另有 WebAssembly 浏览器编辑器",ciFriendlyZh:"可进 CI，但需 Rust、FFmpeg、Skia、libclang，Windows 还要匹配 MSVC 版本"},ceilingZh:"官方给的性能参照是：128 秒的 fframes-intro 在 GPU 上渲染 36 秒，30fps、1920×1080，说明设计目标是“接近实时”的二维矢量出片。它最强的地方是结构简单——每帧一棵 SVG，静态部分编译期 hash 复用，复杂画面也不会引入场景图或运行时；需要质感时再叠 SkSL/Shadertoy 图层。边界在工程侧：Windows 实测编译失败，卡在 Skia 预编译库与 MSVC STL 符号不匹配（skunicode_icu.lib 需要 14.44+ 的 STL），换 clang-cl 从源码重建 Skia 成本极高；还要 FFmpeg 9 shared、libclang、Skia 二进制三件套。它没有 3D 场景、没有相机、没有交互播放器，128 秒级长片也缺少分片和并行渲染方案。它没有时间轴 GUI，所有缓动与节奏都写在 Rust 代码里，改一次要重编译。",workflow:[{stepZh:"准备依赖",detailZh:"Rust 工具链 + FFmpeg 共享库 + libclang + Skia 预编译包；Windows 需匹配 MSVC 版本",effortZh:"30 分钟到数小时"},{stepZh:"建工程",detailZh:"用 cargo 模板或 examples/hello-world，实现 Video trait 的 FPS/尺寸/时长",effortZh:"约 10 分钟"},{stepZh:"写帧",detailZh:"在 render_frame 里用 svgr! 返回 SVG，用 frame.animate 写时间轴",effortZh:"首个片子 2–6 小时"},{stepZh:"自检与预览",detailZh:"inspect 查错、strip/onion 查运动、preview 窗口听声音",effortZh:"随改随看"},{stepZh:"渲染",detailZh:"cargo run --release -- render，先用 --dr 等：Node + ffmpeg 即可，但依赖旧版 fluent-ffmpeg"},ceilingZh:"它的能力上限就是「图片 + 字幕 + 淡入淡出」：每张图能塞任意 ffmpeg filter，尺寸/帧率/停留时长/转场都可调，输出 mp4 或 GIF，做几十张图的相册或商品图集完全够用。实测 300 帧 720p30 用 14.8 秒，约 20fps，5 分钟相册大约 2 分钟渲完。边界清晰：不接受视频输入，没有图层、时间轴、画中画、多音轨；图片比例与输出尺寸不一致时会被裁切；项目停在 2015 年的 fluent-ffmpeg 2.1.2，ffmpeg 7 会因能力预校验直接报错，需关闭校验或锁旧版；无 CLI、无中文文档。它的字幕是烧进画面的，不能外挂；图片之间只有淡入淡出，没有推拉摇移；输出分辨率一旦设定，超出比例的图片会被裁掉两边。",workflow:[{stepZh:"安装",detailZh:"npm install videoshow；确认 ffmpeg 在 PATH，必要时锁 fluent-ffmpeg 2.1.2",effortZh:"约 15 分钟"},{stepZh:"整理图片",detailZh:"把所有图统一到目标尺寸比例，避免裁切",effortZh:"按图量"},{stepZh:"写配置",detailZh:"images: [{path, loop, caption, transition}]，再设 size/fps/format/audio",effortZh:"约 15 分钟"},{stepZh:"生成",detailZh:"videoshow(images, options).save('out.mp4', cb)",effortZh:"实测 10 秒片约 15 秒"},{stepZh:"检查",detailZh:"确认字幕未被裁、音轨长度与画面匹配",effortZh:"约 5 分钟"}],differentiators:["API 极简：一个数组就出片，默认值合理","每张图可挂自定义 ffmpeg filter，细调空间比想象大","同时支持 mp4 与 GIF 输出","字幕与淡入淡出一行配置完成"],limits:["只能处理图片，不接受视频素材","无图层、时间轴、画中画与多音轨","依赖 2015 年的 fluent-ffmpeg，新版 ffmpeg 易报错","无 CLI 与中文文档，长期不更新"],compareTips:[{vs:"mowshon__moviego",adviceZh:"要视频输入、图层与字幕混音选 moviego；纯图片幻灯片用 videoshow 更快上手"},{vs:"mifi__editly",adviceZh:"Editly 支持视频、GL 转场与音频自动化，但安装重；只做图集视频 videoshow 足够"},{vs:"transitive-bullshit__ffmpeg-concat",adviceZh:"要多段视频加转场选 ffmpeg-concat；有一堆图片要成片选 videoshow"}],showcase:{demoBriefZh:"四段：①10 张图默认参数出 640 宽片子；②每张配 caption 与 1 秒淡入淡出；③改 size 到 1280×720 并配乐；④同素材输出 GIF，对比体积与画质",featureCallouts:[{titleZh:"images 数组",descZh:"path/loop/caption/transition 四字段驱动"},{titleZh:"单图 filter",descZh:"每张图可挂自定义 ffmpeg filter"},{titleZh:"字幕",descZh:"caption 与位置/样式可调"},{titleZh:"GIF 输出",descZh:"format:gif 直接出循环动图"},{titleZh:"默认参数",descZh:"25fps、5 秒/张、1 秒转场、640 宽"}]},evidence:[{field:"taglineZh",source:"README.md#L5-L8",noteZh:"自述为基于 ffmpeg 的图片转幻灯片工具，支持音频、字幕、淡入淡出"},{field:"capabilities 默认值",source:"README.md#L186-L205",noteZh:"默认 25fps、每张 loop 5 秒、1 秒 transition、libx264、640 宽、mp4"},{field:"limits 第 3 条",source:"_samples/h2non__videoshow/meta.json",note er(t)，逐帧拍出成片",summaryZh:"Multiplane 是本地无头 HTML 视频渲染器：镜头就是普通网页，页面实现 render(t)，画面只由时间 t 决定；它用无头 Chromium 逐帧截图，做超采样、运动模糊、胶片颗粒与三维层景深，再由 FFmpeg 合成 MP4/WebM/MOV。它解决“用 HTML/CSS/JS 做视频但不想学新框架”的问题，同时把 agent 最怕的确定性问题做成工具：lint 一秒内指出墙钟时间、随机数、CSS 动画与网络资源，verify 会乱序、重载、多进程渲染同一批帧逐像素比对。与 Remotion 相比不要求 React。",whatItMakes:[{type:"3D 卡片/多层视差镜头",exampleZh:"图片卡片进三维空间、焦点在前后景切换、累积景深",strength:"核心能力"},{type:"带运动模糊的动效片",exampleZh:"快速旋转的轮辐、平滑拖尾、按移动距离自动加采样",strength:"核心能力"},{type:"硬切转场",exampleZh:"声明 cuts 后模糊不跨切点，转场干净",strength:"核心能力"},{type:"高质量静帧/海报",exampleZh:"stills 按时刻出 PNG，与视频同一套超采样与透明通道",strength:"可用"},{type:"透明通道叠加层",exampleZh:"--alpha 输出带 alpha 的 MOV/WebM",strength:"可用"}],useCases:[{scenarioZh:"Agent 自动做产品动效片",whoZh:"用 Claude Code/Codex 的团队",whyZh:"lint+verify 让 agent 自己发现不确定性与渲染错误",deliverableZh:"1080p30 的 15–60 秒 MP4",fit:"高度契合"},{scenarioZh:"网页设计师的动效交付",whoZh:"UI/动效设计师",whyZh:"HTML/CSS/JS 直接变视频，不用进 AE",deliverableZh:"1080p 或 720p 短片，带 alpha 版本",fit:"适合"},{scenarioZh:"需要景深的产品展示",whoZh:"品牌/电商团队",whyZh:"三维卡片与真实焦外虚化，比平面动效更有质感",deliverableZh:"10–30 秒产品镜头",fit:"适合"},{scenarioZh:"批量模板渲染",whoZh:"内容工作室",whyZh:"CLI 可脚本化，--workers 并行，--json 可监控",deliverableZh:"多版本 720p/1080p 成片",fit:"适合"},{scenarioZh:"8GB 显存笔记本批量",whoZh:"个人创作者",whyZh:"默认 6 个并行 Chromium 会打爆显存，需手动降到 2 worker",deliverableZh:"小批量短片",fit:"勉强"}],capabilities:{maxResolutionZh:"由镜头页面尺寸与 --scale 决定；实测 1280×720 加 --scale 2 超采样",maxFpsZh:"由 --fps 指定，实测 30fps；无声明上限",durationZh:"由 --duration 指定，无硬限制；实测 2 秒",effectsZh:["超采样抗锯齿","运动模糊（硬切不串）","三维层与累积景深","胶片颗粒","透明通道"],audioZh:"未在 README 声明音频混入能力（未确认）",interactivityZh:"仅离线渲染；页面本身可浏览器预览",automationZh:"CLI 可脚本化：doctor/lint/verify/render/stills，全部支持 --json",assetsZh:"图片、字体、CSS/JS 走 --root 资源根；无内置素材库",exportFormatsZh:["MP4","WebM","MOV（含 alpha）","PNG 静帧"],realtimePreviewZh:"无实时预览器；靠浏览器打开页面自查",ciFriendlyZh:"可进 CI：lint/verify + 确定性逐像素校验"},ceilingZh:"它能做出“不像网页截屏”的画面：实测 2 秒 720p30 镜头用 --scale 2 超采样、--workers 2、NVENC 编码，纯渲染 258 秒、总耗时 384 秒，换来的是抗锯齿、运动模糊与可选景深；三维卡片的前景边缘不会溢出、背景不会渗进轮廓，这是深度图后期做不到的。工程上限体现在 verify：同一批帧乱序、重载、单/多进程渲染后逐像素比对，能把不确定性钉到具体时刻与区域。边界：默认 workers 在本机 8GB 显存下会开 6 个并行 Chromium 直接抖动，必须降到 2；渲染很慢，2 秒成片要 4 分多钟；0.3.8 版本 1.0 前接口会变；需要 Node 24+、Playwright Chromium 与带 libx264 的 FFmpeg；没有音频与字幕系统。它的超采样倍数直接吃显存，8GB 卡上 2 倍已是上限。",workflow:[{stepZh:"安装",detailZh:"Node 24+，npm install multiplane，npx playwright install chromium，装好 FFmpeg",effortZh:"约 10 分钟"},{stepZh:"自检",detailZh:"npx multiplane doctor 检查 Chromium/FFmpeg/编码器；npx multiplane lint 镜头",effortZh:"约 1 分钟"},{stepZh:"写镜头",detailZh:"页面实现 render(t)，声明 cuts 与三维层，资源放 --root 目录",effortZh:"首个镜头 2–4 小时"},{stepZh:"渲染",detailZh:"npx multiplane render examples/animation.html --out out.mp4 --duration 2 --fps 30 --scale 2 --workers 2 --encoder nvenc-h264",effortZh:"2 秒约 4 分钟"},{stepZh:"验证",detailZh:"npx multiplane verify 做乱序/重载/多进程逐像素比对",effortZh:"约数分钟"}],differentiators:["镜头就是 HTML+CSS+JS，agent 不需要学新 DSL，天然适配代码生成","运动模糊按快门时间多次采样且不跨硬切，转场干净","三维卡片用多次采样累积出真实景深，边缘不溢出不渗透","lint 一秒内定位墙钟/随机数/CSS 动画等非确定性写法，verify 逐像素证明"],limits:["渲染慢：2 秒 720p 成片实测约 4 分钟，长片按比例膨胀","8GB 显存下默认 6 worker 会抖动，必须手动降并发","0.3.8 版本，1.0 前 CLI 与选项可能调整","没有音频/字幕/时间轴编辑，叙事仍要在页面代码里写"],compareTips:[{vs:"wx4766__html-to-video",adviceZh:"要模板、批量比例与 QA 选 html-to-video；要超采样、景深、运动模糊与确定性验证选 Multiplane"},{vs:"remotion-dev__remotion",adviceZh:"要 React 生态与云端批量选 Remotion；要纯 HTML 镜头与可验证的本地渲染选 Multiplane"},{vs:"BintzGavin__helios",adviceZh:"要原生 CSS 时间轴与播放器选 Helios；要 render(t) 逐帧与三维景深选 Multiplane"}],showcase:{demoBriefZh:"四段：①lint 一秒内标出随机数与墙钟写法；②三维卡片镜头焦点从前景切到背景；③运动模糊在硬切两侧不串色；④verify 的多进程逐像素报告与 720p30 成片",featureCallouts:[{titleZh:"HTML 写镜头",descZh:"实现 render(t) 就是全部 API"},{titleZh:"累积景深",descZh:"三维卡片真实焦外"},{titleZh:"运动模糊",descZh:"多次采样且硬切不糊"},{titleZh:"lint 确定性",descZh:"一秒定位非确定写法"},{titleZh:"verify 逐像素",descZh:"乱序多进程逐像素比对"}]},evidence:[{field:"taglineZh",source:"README.md#L8-L10",noteZh:"给 agent 的本地无头 HTML 渲染器，页面实现 render(t)"},{field:"capabilities.effectsZh",source:"README.md#L18-L27",noteZh:"lint/verify、运动模糊不跨硬切、三维层与累积景深、stills"},{field:"capabilities.exportFormatsZh",source },{field:"克隆",source:"本地实测",noteZh:"90MB 源码，解压 166s"},{field:"样例",source:"本地实测",noteZh:"最小脚本取 styles/ascii-crt/demo 前 5s 出片（1280×720/24→30fps），补 VT323 字体后跑通"}]},"leonid-shevtsov__headless":{id:"leonid-shevtsov__headless",taglineZh:"Ruby 里开一块 Xvfb 虚拟屏，顺手把这块屏录成视频或截图的 gem",summaryZh:"2010 年起的 Ruby gem，用 Xvfb 起一个虚拟 X 显示，让 Selenium、wkhtmltopdf 这类需要图形界面的程序在无头服务器上跑；再用 ffmpeg 抓 framebuffer，把整块屏幕连续录成 mov/mp4，或随时截图。它解决的是「Linux CI 里没有显示器」的问题，本质是显示环境与录屏基础设施，不是动画引擎：画面来自你跑起来的程序，它只负责把屏幕像素收下来。本次因 Windows 没有 Xvfb/PTY 直接跳过，无产物可验证；定位应理解为「测试录像」而不是内容创作工具。",whatItMakes:[{type:"失败测试的屏幕录像",exampleZh:"Cucumber 场景失败时自动保存该用例的 mov，便于回看 UI 操作",strength:"核心能力"},{type:"GUI 操作演示录制",exampleZh:"远程 Linux 上跑脚本操作浏览器，按 12fps 录全程",strength:"可用"},{type:"网页截图",exampleZh:"take_screenshot 走 ImageMagick 或 xwd，按扩展名定格式",strength:"核心能力"},{type:"PDF 渲染隔离",exampleZh:"wkhtmltopdf 在独立 display 里跑，避免抢占浏览器焦点",strength:"可用"},{type:"动画/合成视频",exampleZh:"无内置合成、转场、字幕能力，只能录已有窗口",strength:"受限"}],useCases:[{scenarioZh:"CI 里录失败用例",whoZh:"Ruby/Rails 测试团队",whyZh:"Selenium 用例失败时自动留下屏幕录像，比日志更快定位 UI 问题",deliverableZh:"按用例命名的 mov 片段，常用 12fps",fit:"高度契合"},{scenarioZh:"无头服务器跑 GUI 程序",whoZh:"运维、Docker 镜像维护者",whyZh:"一行 Headless.ly 就能在没有显示器的机器上跑浏览器或 GUI 工具",deliverableZh:"可用的虚拟显示环境，无视频",fit:"高度契合"},{scenarioZh:"PDF/截图批处理",whoZh:"文档流水线开发者",whyZh:"wkhtmltopdf、import、xwd 都能在独立 display 里工作",deliverableZh:"PNG/PDF 文件",fit:"适合"},{scenarioZh:"终端/Shell 演示录制",whoZh:"教程作者",whyZh:"能录窗口但不能录字符流，终端演示更适合 asciinema",deliverableZh:"整屏 mov，无逐字回放",fit:"勉强"},{scenarioZh:"Windows 本地出片",whoZh:"任何 Windows 用户",whyZh:"无 Xvfb 与 Unix PTY 实现，完全跑不起来",deliverableZh:"无",fit:"勉强"}],capabilities:{maxResolutionZh:"由 Xvfb 虚拟屏尺寸决定，README 未声明上限；记录的是整屏 framebuffer，不做缩放",maxFpsZh:"可配，示例用 12fps；高帧率会增加 ffmpeg 与 CPU 压力，未给出上限",durationZh:"连续捕获，无硬上限；长录像文件体积与磁盘直接相关",effectsZh:["无任何合成/转场/滤镜","整屏 framebuffer 捕获","ImageMagick 或 xwd 两种截图后端"],audioZh:"无音频捕获，录出的是无声视频",interactivityZh:"无；只有 Ruby API 与块模式/对象模式两种用法",automationZh:"强：可在 Ruby 脚本、Cucumber hook、并行测试中调用，支持 display 复用与 destroy_at_exit:false",assetsZh:"无素材库；依赖系统的 ffmpeg、ImageMagick、xwd/netpbm",exportFormatsZh:["mov（默认临时容器）","mp4/其他 ffmpeg 支持的容器（靠 :extra 传参）","png 等截图格式"],realtimePreviewZh:"无预览界面，录完直接落盘",ciFriendlyZh:"高（仅 Linux CI）：gem 安装 + Xvfb 即可，是 CI 录像的经典方案"},ceilingZh:"能力上限由 Xvfb 与 ffmpeg 决定：屏幕尺寸任意、时长不限、帧率可调到 24/30fps，最复杂的用法是多线程测试里先起一个 display 100、各进程 reuse:true 共享，最后统一 destroy。但它始终只是「录屏 + 无头显示」：没有时间轴、没有画面合成、没有字幕、没有音轨，也无法把 DOM 或 canvas 直接变成视频，画质就是屏幕分辨率本身。硬边界非常明确——Windows 无 Xvfb 与 Unix PTY，本次在 Windows 上直接 skip，没有任何产物；macOS 需要 XQuartz，且 README 明说不会隐藏大多数应用；跨平台可用性基本限定在 Linux 容器。另外 gem 无预编译包，Ruby 版本升级后常需重装；录出的文件默认是 mov 临时容器，要 mp4 还得自己传 ffmpeg 参数，长录像的磁盘占用按屏幕分辨率乘以时长直接累加。",workflow:[{stepZh:"装系统依赖",detailZh:"Debian/Ubuntu 执行 apt-get install xvfb，并准备 ffmpeg；截图还需 imagemagick 或 X11-apps",effortZh:"约 10 分钟"},{stepZh:"装 gem",detailZh:"gem install headless；无预编译包，需要 Ruby 与编译链",effortZh:"约 10 分钟"},{stepZh:"起虚拟屏",detailZh:"Headless.new.start，或 Headless.ly 块模式；可指定 display 号",effortZh:"约 5 分钟"},{stepZh:"开始录制",detailZh:"headless.video.start_capture；可通过 :video 哈希传 frame_rate、codec、ffmpeg_path",effortZh:"约 5 分钟"},{stepZh:"保存或丢弃",detailZh:"场景失败时 stop_and_save 到指定路径，成功则 stop_and_discard",effortZh:"约 5 分钟"}],differentiators:["真实抓取 framebuffer，不做 DOM 重绘或模拟，所见即所录","块模式一行包住 Selenium 会话，测试代码几乎不用改","支持多进程共享同一 display，适合并行测试矩阵","截图可选 ImageMagick（通用）或 xwd（快但需转换）"],limits:["Windows 完全不可用：缺 Xvfb 与 Unix PTY，本次直接跳过","没有音频、字幕、转场与合成，只是屏幕录像","无预编译 gem，安装依赖 Ruby 编译环境","macOS 需 XQuartz，且不会隐藏大多数应用"],compareTips:[{vs:"asciinema__asciinema",adviceZh:"要终端逐字回放、可复制文本、跨平台，选 asciinema；要录整个 GUI 窗口的像素，选 headless（且只能 Linux）"},{vs:"charmbracelet__vhs",adviceZh:"vhs 用脚本声明终端画面、能出 GIF/MP4 且有 Windows 支持；headless 只能实拍真实窗口，不可编排"},{vs:"asciinema__agg",adviceZh:"已有 .cast 录像想转 GIF/MP4 用 agg，不需要 headless 这类虚拟屏方案"}],showcase:{demoBriefZh:"本批未出片（Windows 无 Xvfb/PTY）。若在 Linux 演示，建议四段：①Headless.ly 里跑 Selenium 并打开页面；②start_capture 后录一段 12fps 操作；③失败场景 stop_and_save 得到 mov，成功场景丢弃；④演示 take_screenshot 的 imagemagick 与 xwd 两种方式",featureCallouts:[{titleZh:"Xvfb 虚拟 ","依赖浏览器环境，性能与显存受终端设备限制"],compareTips:[{vs:"ManimCommunity__manim",adviceZh:"要 3D、LaTeX 与批量成片选 ManimCE；要网页内嵌与免安装交互选 manim-web"},{vs:"academa-labs__manimgx",adviceZh:"要 3D 与高帧率成片选 ManimGX；要在浏览器里直接播放并嵌页面选 manim-web"},{vs:"yongkyuns__noon",adviceZh:"要 Rust 引擎与音频设备控制选 Noon；要现成 Manim API 与播放器选 manim-web"}],showcase:{demoBriefZh:"四段：①CDN 引入后页面直接播放 SquareToCircle；②内置播放器拖动与分段；③分子或地图模块展示 ManimCE 没有的能力；④GIF 导出成功与 WebM 空文件的对比",featureCallouts:[{titleZh:"浏览器跑 Manim",descZh:"完全无需安装 Python 与 LaTeX"},{titleZh:"429 API 对齐",descZh:"429 个可行符号全部移植"},{titleZh:"交互播放器",descZh:"播放暂停拖动分段"},{titleZh:"分子/地图模块",descZh:"Manim 生态之外独有的扩展"},{titleZh:"GIF 直出",descZh:"页面内可直接导出 GIF 动图"}]},evidence:[{field:"taglineZh",source:"README.md#L3-L9",noteZh:"自述 Manim in the browser, No Python，TypeScript 移植 + 四类原生模块"},{field:"capabilities.maxResolutionZh",source:"README.md#L47-L67",noteZh:"Scene 构造可设 width/height，CDN 示例 500×300"},{field:"capabilities.effectsZh",source:"README.md#L31-L41",noteZh:"429/429 API parity、玩家、GIF/WebCodecs 导出、React/Vue 集成"},{field:"ceilingZh",source:"_samples/maloyan__manim-web/meta.json",noteZh:"实测 GIF 2.7s/720p30 导出 43s；WebM 导出仅 110B 空文件；vite build 47s"}]},"ManimCommunity__manim-voiceover":{id:"ManimCommunity__manim-voiceover",taglineZh:"Manim 配音插件：TTS、录音、翻译，配合 Whisper 逐词触发动画并自动出字幕",summaryZh:"ManimCE 官方生态里的配音插件（约 326 stars，v0.4.0）：用 `with self.voiceover(text=...)` 包住一段动画，插件根据音频实际时长自动决定等待，并把音轨混进成片；配音来源有 Gemini、Azure、gTTS、pyttsx3 四家 TTS 与麦克风录音，Whisper 给出逐词时间戳后可以用 `tracker.duration` 把动画绑到具体单词上，最后导出同名 srt。它解决的是「Manim 成片没声音、配音与画面永远对不准」，是数学课件从默片变网课的关键一步。实测 336 帧 720p 用 58 秒（含 TTS 与 mux）。对已有 Manim 课件，加配音几乎不用改场景结构。",whatItMakes:[{type:"带旁白的数学动画",exampleZh:"一个 voiceover 块包住公式推导，音频结束自动进入下一步",strength:"核心能力"},{type:"逐词同步动画",exampleZh:"Whisper 时间戳触发「讲到这个词时高亮对应项」",strength:"核心能力"},{type:"自动字幕",exampleZh:"每条 voiceover 生成同名 .srt，可直接烧进或外挂",strength:"核心能力"},{type:"多语言配音版本",exampleZh:"DeepL 翻译后重新 TTS，一套课件出多语版",strength:"可用"},{type:"真人录音讲解",exampleZh:"CLI 录制模式边渲边录，适合教师本人配音",strength:"可用"},{type:"纯视觉特效",exampleZh:"只管音频与时序，不做任何画面特效",strength:"受限"}],useCases:[{scenarioZh:"网课讲师做旁白课件",whoZh:"高校讲师、课程团队",whyZh:"不用跳出 Python 去剪辑配音，渲染即出带旁白成片",deliverableZh:"720p/1080p 30fps MP4 + srt，单段 1–10 分钟",fit:"高度契合"},{scenarioZh:"科普频道",whoZh:"科普作者",whyZh:"AI 音色先出草稿，定稿后再换真人录音，流程可复用",deliverableZh:"5–15 分钟 1080p MP4",fit:"高度契合"},{scenarioZh:"多语言课程",whoZh:"国际化课程团队",whyZh:"DeepL 翻译台词后重渲，字幕与配音同步产出",deliverableZh:"同一课件的多语版本",fit:"适合"},{scenarioZh:"无障碍字幕视频",whoZh:"教育机构",whyZh:"自动 srt 可直接作为无障碍字幕交付",deliverableZh:"MP4 + SRT 字幕对",fit:"适合"},{scenarioZh:"无配音需求的纯动画",whoZh:"动效创作者",whyZh:"画面能力完全来自 Manim，本身不提供视觉特效",deliverableZh:"可直接用 ManimCE",fit:"勉强"}],capabilities:{maxResolutionZh:"由 ManimCE 配置决定，实测 720p，可配 1080p/4K（未验证 4K）",maxFpsZh:"ManimCE 可配 15/30/60，实测 30fps",durationZh:"不限；由若干 voiceover 块与场景组成，实测 336 帧 11.2 秒",effectsZh:["无视觉特效","逐词触发动画（Whisper 时间戳）","多段配音排队与自动等待"],audioZh:"四家 TTS（Gemini/Azure/gTTS/pyttsx3）+ 麦克风录音 + 背景音乐；自动混入成片并生成 srt",interactivityZh:"无交互；录制模式有 CLI 提示与倒计时",automationZh:"manim CLI 渲染即可；另有 manim_translate、manim_render_translation 两个翻译脚本",assetsZh:"语音文件、srt、背景音乐、Manim 字体；无素材库",exportFormatsZh:["mp4（含音轨）","srt 字幕"],realtimePreviewZh:"无实时预览，渲染后成片",ciFriendlyZh:"中等：TTS 需网络或本地引擎，Azure/Gemini 需 Key"},ceilingZh:"能力上限是「逐词级音画同步」：Whisper 给出每个词的时间戳，动画可以精确绑到某个词，这在教学视频里非常值钱；配音可换四家 TTS 或真人录音，台词能经 DeepL 翻译后重新出片，一套课件做多语版本。实测 336 帧 720p30 用 58 秒（约 5.8fps，含 TTS 与混流），一分钟片子约 5 分钟，长课件可行。边界：它完全没有画面能力，所以天花板取决于 Manim；Windows 上 SAPI 音色写 WAV 却按 .mp3 命名，会让 moviepy 读音频时报错，本次需子类修正；同进程二次 runAndWait 会死锁，必须开独立子进程；离线音色较机械，正式出版仍需真人配音。背景音乐与配音的混音只有基础能力，复杂响度处理仍要后期。",workflow:[{stepZh:"装 Manim 与插件",detailZh:"先装 ManimCE，再 pip install manim-voiceover（Python>=3.11）",effortZh:"约 30 分钟"},{stepZh:"选配音来源",detailZh:"Gemini/Azure 需 Key，gTTS 免费但需联网，pyttsx3 与录音可离线",effortZh:"约 10 分钟"},{stepZh:"写 voiceover 块",detailZh:'with self.voiceover(text="...") as tracker: self.play(...)，用 tracker.duration 控时序',effortZh:"首个场景 1 小时"},{stepZh:"对齐与字幕",detailZh:"需要逐词时用 Whisper 书签；渲染时自动生成 srt",effortZh:"约 20 分钟"},{stepZh:"渲染出片",detailZh:"manim -pqh scene.py，输出 mp4 与同名 srt",effortZh:"实测 11 秒片约 58 秒"}],differentiators:["逐词时间戳触发动画，讲哪个词就亮哪个对象","四家 TTS 可换，草稿用 AI、定稿换真人","DeepL 翻译后重渲，一套课件出多语版","自动生成 srt，字幕与配音天然对齐"],limits:["完全依赖 Manim，自身没有视觉能力","Windows SAPI 有扩展名 bug，需改子类规避","同进程重复调用 TTS 会死锁，要开子进程","离线音色机械，正式课程仍需真人"],compareTips:[{vs:"ManimCommunity__manim",adviceZh:"ManimCE 出画面，本插件加旁白；做默片数学动画只用 CE，要网课成片再装它"},{vs:"jeertmans__manim-slides",adviceZh:"manim-slides 做可交互幻灯片演示；manim-voiceover 做线性旁白成片，目标不同可叠加"},{vs:"krassowski__jupyter-manim",adviceZh:"要在 Notebook 里快速看效果用 jupyter-manim；要正式带旁白成片用 manim-voiceover"}],showcase:{demoBriefZh:"四段：①一段公式推导配 gTTS 旁白，展示音频结束自动进入下一步；②Whisper 逐词时间戳，讲到「矩阵」时高亮矩阵；③导出 srt 并在播放器里挂字幕；④DeepL 翻译成英文后重渲，对比两版",featureCallouts:[{titleZh:"voiceover 上下文",descZh:"包住动画块，按时长自动等待"},{titleZh:"逐词同步",descZh:"Whisper 时间戳绑定单词"},{titleZh:"四家 TTS",descZh:"Gemini/Azure/gTTS/pyttsx3 可切"},{titleZh:"自动 srt",descZh:"每条配音产出同名字幕"},{titleZh:"翻译工作流",descZh:"DeepL 翻译脚本重渲多语版"}]},evidence:[{field:"taglineZh",source:"README.md#L12-L17",noteZh:"插件定位、录音 CLI、AI 音色、Whisper 逐词时间戳"},{field:"capabilities.audioZh",source:"README.md#L23-L28",noteZh:"支持 Gemini、Azure、gTTS、pyttsx3 四家 TTS"},{field:"whatItMakes 第 4 条",source:"README.md#L44-L46",noteZh:"可用 DeepL 等机器翻译把配音转成其他语言"},{field:"ceilingZh",source:"_samples/ManimCommunity__manim-voiceover/meta.json",noteZh:"实测 720p/30fps/336 帧耗时 58s，含 TTS 与混流，约 5.8fps"}]},ManimCommunity__manim:{id:"ManimCommunity__manim",taglineZh:"3Blue1Brown 引擎的社区版：用 Python 数学对象讲清公式、几何与 3D",summaryZh:"Manim Community 是 3b1b 动画引擎的开源维护版：用 Python 描述 Mobject（圆、公式、坐标轴）与动画（Create、Transform、FadeOut），Cairo 或 OpenGL 渲染器逐帧绘制，ffmpeg 编码成 MP4/GIF。它的核心资产不是速度，而是数学语义、LaTeX 排版与十年积累的示例和插件——公式能逐项变形、坐标系能精确对齐。与 ManimGX、Ranim 相比它慢、安装重，但 API 最全、教程最多；与 Remotion 相比它只擅长把数学讲清楚，不适合 UI 演示与美术场景。社区版文档与教程最全，遇到问题更容易搜到答案。",whatItMakes:[{type:"公式推导动画",exampleZh:"LaTeX 公式逐项变形、配方法、求导与积分步骤",strength:"核心能力"},{type:"几何/线性代数演示",exampleZh:"平面变换、向量场、矩阵作用于网格、单位圆",strength:"核心能力"},{type:"3D 曲面与相机",exampleZh:"OpenGL 渲染器下的曲面、参数方程、环绕镜头",strength:"可用"},{type:"函数/数据图像",exampleZh:"Axes 坐标系、曲线绘制、切线沿曲线滑动",strength:"核心能力"},{type:"带配乐的教学片段",exampleZh:"add_sound 挂音轨，动画节点与音乐对齐",strength:"可用"}],useCases:[{scenarioZh:"大学数学/物理课件",whoZh:"教师、课程制作团队",whyZh:"公式与几何对象有语义，改一行步长即可重渲整段推导",deliverableZh:"-qh 1080p60 MP4，单条 3–15 分钟",fit:"高度契合"},{scenarioZh:"科普频道的数学短片",whoZh:"科普创作者",whyZh:"3b1b 同源画风，公式排版与镜头语言成熟",deliverableZh:"1080p60 的 5–20 分钟",fit:"高度契合"},{scenarioZh:"论文/答辩配图视频",whoZh:"研究生、科研人员",whyZh:"LaTeX 公式直接进画面，比 PPT 动画精确",deliverableZh:"720p/1080p 的 1–5 分钟",fit:"适合"},{scenarioZh:"需要 4K 的商用课程",whoZh:"出版级课程团队",whyZh:"-qk 支持 2160p60，但渲染时间成倍增长",deliverableZh:"4K60 MP4",fit:"适合"},{scenarioZh:"产品/UI 演示视频",whoZh:"市场团队",whyZh:"没有网页、组件与截图能力，做产品 UI 很别扭",deliverableZh:"不适用",fit:"勉强"}],capabilities:{maxResolutionZh:"质量档 -ql 480p15、-qm 720p30、-qh 1080p60、-qk 2160p60；实测 1280×720",maxFpsZh:"-ql 15fps、-qm 30fps、-qh/-qk 60fps；可在 config 自定义",durationZh:"无硬限制；长片按帧线性增长，单条 10 分钟以上要分 Scene",effectsZh:["LaTeX 公式排版与 Transform","2D 矢量图形与坐标系","OpenGL 3D 曲面与相机","音频 add_sound"],audioZh:"支持 add_sound 挂外部音轨；不内置 TTS 与字幕对齐",interactivityZh:"仅渲染；IPython magic 可在 Jupyter 里预览，但不是交互播放器",automationZh:"CLI 可脚本化：manim -qh scene.py Scene，支持 -n 跳动画、-s 只出末帧",assetsZh:"依赖 LaTeX 发行版与系统字体；图片/SVG 可导入，3D 模型支持有限",exportFormatsZh:["MP4","GIF","PNG 序列","单帧 PNG"],realtimePreviewZh:"部分：-p 渲完自动播放；OpenGL 渲染器可交互预览",ciFriendlyZh:"可进 CI（Docker 镜像），但 LaTeX 与 ffmpeg 依赖重"},ceilingZh:"它最强的是“把推导过程逐帧讲透”：-qh 可出 1080p60，-qk 可出 4K60，公式、坐标系、3D 曲面与相机可以在一个 Scene 里连续运动；配合 Transform/ReplacementTransform 能做逐项变形，配合 Axes/NumberPlane 能做精确的几何演示。实测 3 秒 720p30 画面渲染 73 秒，总耗时 350 秒（含 pip 安装），CPU 渲染的代价很明显，10 分钟 1080p60 的片子要按小时计。边界：Cairo 渲染器不支持真 3D，3D 必须换 OpenGL 渲染器且稳定性较差；LaTeX 是硬依赖，Windows 上装 TeX 与字体常是第一个坑；Python 逐帧执行，复杂场景很容易卡；没有可视化编辑器、没有云端批量、没有音频对齐工具。它对硬件没有要求，但 CPU 单线程渲染让长片非常吃时间，教学短片控制在 3 分钟内更现实。",workflow:[{stepZh:"安装",detailZh:"Python 3.9+ 加 pip install manim；再装 LaTeX（MiKTeX/TeX Live）与 ffmpeg",effortZh:"30–60 分钟"},{stepZh:"写场景",detailZh:"继承 Scene，用 Mobject 与动画方法描述内容，公式用 MathTex",effortZh:"首个场景 2–6 小时" 它没有 3D 与复杂材质，但能和公式排版混排。硬伤是版本兼容与低帧率穿透。",whatItMakes:[{type:"刚体/碰撞演示",exampleZh:"小球落地、方块堆叠、三角滚落、斜面滑动",strength:"核心能力"},{type:"受力与斜面教学",exampleZh:"重力/支持力/摩擦力箭头，随运动实时变化",strength:"核心能力"},{type:"电磁场可视化",exampleZh:"点电荷场线、带电粒子轨迹、透镜与面镜成像",strength:"可用"},{type:"波动/光学动画",exampleZh:"波的传播、干涉、折射路径",strength:"可用"},{type:"与公式混排的物理讲解",exampleZh:"Manim 文字/公式与物理对象同场景出现",strength:"核心能力"}],useCases:[{scenarioZh:"高中/大学物理课件",whoZh:"物理教师、教研团队",whyZh:"碰撞与受力不需要手算关键帧，改参数即得新过程",deliverableZh:"720p/1080p 的 2–8 分钟教学片",fit:"高度契合"},{scenarioZh:"物理科普短视频",whoZh:"科普作者",whyZh:"真实物理运动比关键帧更有说服力",deliverableZh:"1080p 的 1–3 分钟短片",fit:"适合"},{scenarioZh:"电磁学可视化课程",whoZh:"大学讲师",whyZh:"内置电磁模块，场线与成像可直接调用",deliverableZh:"1080p60 片段",fit:"适合"},{scenarioZh:"3D 物理场景",whoZh:"需要立体演示的团队",whyZh:"pymunk 是 2D，没有 3D 刚体与碰撞",deliverableZh:"不适用",fit:"勉强"},{scenarioZh:"新版 Manim 直接安装",whoZh:"使用 Manim 0.19 的用户",whyZh:"0.4.0 的 Requires-Python 是 <3.13，且 Space API 在新版被移除，需要打补丁",deliverableZh:"需改造环境",fit:"勉强"}],capabilities:{maxResolutionZh:"继承 Manim 质量档，-qm 720p、-qh 1080p、-qk 4K；实测 1280×720",maxFpsZh:"继承 Manim，-qm 30fps、-qh 60fps；物理稳定性建议提高帧率",durationZh:"无硬限制；实测 3 秒",effectsZh:["pymunk 2D 刚体与碰撞","弹簧、斜面、地面","电磁场线与粒子","透镜/面镜成像","与 Manim 公式/文字混排"],audioZh:"继承 Manim 的 add_sound；插件本身不做音频",interactivityZh:"仅渲染；Manim 的预览窗口可播放",automationZh:"CLI 可脚本化：manim -qm scene.py SpaceScene",assetsZh:"沿用 Manim 素材体系；物理对象由代码生成",exportFormatsZh:["MP4","GIF","PNG 序列"],realtimePreviewZh:"部分：Manim -p 渲完播放",ciFriendlyZh:"可进 CI，但需固定 Manim 与插件版本，Python 3.13 要绕依赖"},ceilingZh:"它能把“物理过程”直接交给引擎跑：实测自写 SpaceScene（圆/方/三角刚体落在静态地面）用 manim 0.19 + manim-physics 0.4.0 渲染 3 秒 720p30 只要 13.5 秒，比纯 Manim 的关键帧计算更省事，画面也真实。上限取决于 pymunk 的 2D 能力与 Manim 的渲染：刚体数量、碰撞形状复杂度、弹簧约束都会拖慢；官方也提醒低帧率会导致碰撞穿透，复杂堆叠要抬高 fps。边界：只有 2D，没有 3D 刚体；0.4.0 的 Requires-Python 限 <3.13，本机 Python 3.13 需 --ignore-requires-python --no-deps 再补 pymunk/shapely；Manim 0.19 移除了 Space，得用补丁或降级；没有可视化物理编辑器，参数全靠代码。实测 3 秒 720p30 渲染 13.5 秒，比纯 Manim 关键帧省代码但不省时间；刚体超过几十个后会明显掉帧，复杂堆叠要抬高 fps。",workflow:[{stepZh:"安装",detailZh:"装 M eoFlow 用 JSON 跨端复用；Motion Canvas 用 TS scene graph + 编辑器，按是否需要可视化调参来选"}],showcase:{demoBriefZh:"四段：①编辑器实时预览一段文字 + 图形入场；②数据图表随信号增长，展示 TS 算数据的优势；③Layout/Flow 自动布局的节点重排；④音轨与动画同步，展示配音节奏对齐",featureCallouts:[{titleZh:"Generator 时间线",descZh:"yield* waitFor / all 线性读动画"},{titleZh:"信号驱动",descZh:"值变化自动触发补间，无需手动帧"},{titleZh:"实时编辑器",descZh:"拖时间轴、改属性即时预览"},{titleZh:"Layout/Flow",descZh:"节点自动排布与重排"},{titleZh:"音轨同步",descZh:"音频与动画同一时间线"}]},evidence:[{field:"taglineZh",source:"README.md#L18-L29",noteZh:"自述为 TypeScript 动画库 + 编辑器，定位信息类动画与配音同步"},{field:"workflow 第 2 步",source:"README.md#L37-L55",noteZh:"monorepo 含 core/2d/ui/examples/docs，本地开发需 lerna build"},{field:"limits 第 1 条",source:"_samples/motion-canvas__motion-canvas/meta.json",noteZh:"实测 960×540/30fps/120 帧耗时 900s，约 0.13fps"},{field:"limits 第 2 条",source:"_reports/",noteZh:"本批报告记录官方编辑器构建后缺失、需注入 stage 逐帧渲染"}]},mowshon__moviego:{id:"mowshon__moviego",taglineZh:"Go 写的脚本化剪辑库：用类型化 clip 图组合图层、字幕、音频，再交给 FFmpeg 出片",summaryZh:"MovieGo v2（约 303 stars，MIT）把 MoviePy 那套「时间→帧」模型搬到 Go：clip 图是强类型的，帧缓冲单所有权，帧率用有理数避免浮点误差，逐帧像素工作丢进 worker pool 并行；如果整条图能表达成一个 FFmpeg filtergraph，就直接走 FFmpeg-only 快路径，完全不碰 Go 像素。它能做裁剪、缩放、淡入、合成、拼接、文字字幕、音频混音、透明导出。实测 720p30 的 150 帧只用 4.6 秒（约 32.8fps），是本批最快的一档。MIT 许可，v2 已把核心功能与竞态测试补齐。代价是生态小，遇到问题只能读源码与测试。",whatItMakes:[{type:"画中画与图层合成",exampleZh:"Composite 多层定位，视频/图片/文字叠在背景上",strength:"核心能力"},{type:"图片/视频幻灯片",exampleZh:"片段拼接 + 淡入淡出 + 统一尺寸与帧率",strength:"核心能力"},{type:"字幕烧录",exampleZh:"Text 与 Subtitles 支持样式、位置、时间区间",strength:"核心能力"},{type:"音频混音",exampleZh:"多音轨混合、音量与静音段处理后 mux 进视频",strength:"可用"},{type:"透明通道导出",exampleZh:"透明背景导出，便于叠到别的工程里",strength:"可用"},{type:"复杂动效与 GL 转场",exampleZh:"无 shader 转场体系，复杂效果要自己拼 filter 或逐帧画",strength:"受限"}],useCases:[{scenarioZh:"服务端批量合成",whoZh:"Go 后端团队",whyZh:"单二进制 + ffmpeg，天然适合容器与高并发，模板化出片稳定",deliverableZh:"1080p30 的 15–60 秒 MP4，按请求批量",fit:"高度契合"},{scenarioZh:"电商商品视频",whoZh:"电商运营、SaaS 服务商",whyZh:"图片 + 文字 + 价格卡片 + 音乐，一天几千条的量级",deliverableZh:"方形/竖屏 1080p MP4",fit:"高度契合"},{scenarioZh:"社媒模板视频",whoZh:" ryZh:"Remocn 是 Remotion 的 copy-paste 组件注册表：npx shadcn add 把组件源码连同依赖直接复制进工程，而不是装运行时包。它把“每个淡入、擦除、动态标题都从零写”的重复劳动变成挑一个改参数，组件统一用 useCurrentFrame/interpolate/spring，避开会破坏渲染的 Math.random。它本身不渲染视频、没有 CLI，必须挂在 Remotion 工程里。与 SnapCN 同类，但 Remocn 是通用动效原语库，SnapCN 更偏产品 demo 专用镜头。组件页可逐帧 scrub，但整套片子仍要自己排时间轴；它不提供 CLI 与批量导出。",whatItMakes:[{type:"文字与标题动画",exampleZh:"打字机、逐字弹入、模糊揭示、动态排版、刮擦替换",strength:"核心能力"},{type:"转场与溶解效果",exampleZh:"纸张撕裂、故障切割、像素排序、烟雾溶解、镜头推拉",strength:"核心能力"},{type:"产品 Demo 动效",exampleZh:"模拟光标、终端窗口、聊天界面、代码块推近",strength:"可用"},{type:"数据/图表动画",exampleZh:"动画条形图、折线图、数字滚轮、共享坐标轴",strength:"可用"},{type:"整片模板",exampleZh:"发布预告、产品发布、品牌规范、工作流演示等 6 套模板",strength:"可用"}],useCases:[{scenarioZh:"SaaS 产品演示片",whoZh:"独立开发者、小团队",whyZh:"直接 add 聊天/终端/光标组件，当天拼出可发的 demo",deliverableZh:"1080p30 的 30–60 秒 MP4",fit:"高度契合"},{scenarioZh:"发布/融资预告",whoZh:"创始人、市场负责人",whyZh:"release-teaser 等模板改文案即可出片",deliverableZh:"15–30 秒竖屏或横屏短片",fit:"适合"},{scenarioZh:"动效原语二开",whoZh:"前端/动效工程师",whyZh:"源码进仓库，可任意改参数与时间曲线，不受包版本限制",deliverableZh:"自定义组件与品牌动效库",fit:"适合"},{scenarioZh:"Agent 自动拼片",whoZh:"Claude Code/Codex 用户",whyZh:"skill 按 brief→storyboard→install→compose→视觉检查走流程",deliverableZh:"模板化 30–90 秒视频",fit:"适合"},{scenarioZh:"无 Remotion 的轻量需求",whoZh:"只想快速出片的人",whyZh:"需要 Remotion 宿主工程，零基础仍要装 Node 与依赖",deliverableZh:"需先搭工程",fit:"勉强"}],capabilities:{maxResolutionZh:"由宿主 Remotion Composition 决定，常见 1920×1080；实测 1280×720",maxFpsZh:"由宿主 Composition 决定，示例 30fps；组件本身不限制",durationZh:"无硬限制，取决于宿主时间轴；单组件通常 1–5 秒",effectsZh:["CSS/Canvas/SVG 动效原语","着色器背景与溶解","字幕/排版动画","3D 景深、镜头缩放等伪 3D 效果"],audioZh:"组件库不含音频能力；需在 Remotion 宿主里自行加 <Audio>",interactivityZh:"无交互；仅 @remotion/player 的预览 scrub",automationZh:"无 CLI，靠宿主 Remotion 的 npx remotion render",assetsZh:"图标（remocn-icons）与 UI 原语（remocn-ui）随 registry 提供；字体需宿主自备",exportFormatsZh:["MP4（经 Remotion）","PNG 静帧（经 Remotion）"],realtimePreviewZh:"有：每个组件页挂 @remotion/player",ciFriendlyZh:"可进 CI，前提是宿主 Remotion 工程可构建"},ceilingZh:"它的天花板就是 Remotion 的天花板，但把“从零写动效”压成“挑组件再改参数”：registry 下约 280 个组件目录，覆盖 50 多种 46.8 秒，总耗时 666 秒（含 npm 安装），画面是 WebGL 实时渲染后逐帧截取。可以做相机环绕、材质变化、几何阵列，也能把 3D 物件和 2D 标题叠在一个 Composition 里。上限受 Chromium 的 WebGL 与显存约束：高面数模型、复杂 PBR、体积光会明显掉帧；4K 需要更大显存与更长渲染时间。边界还包括：它只是模板，不含模型资产、UV、烘焙与后期；没有 Blender 的 GI 与合成器；模板代码需要自己扩展成工程。实测 720p 的 150 帧渲染 46.8 秒，4K 会明显更久；没有模型压缩与贴图优化，大资产要自己处理。",workflow:[{stepZh:"安装",detailZh:"模板目录 npm install，Node ≥16",effortZh:"约 5–10 分钟"},{stepZh:"搭场景",detailZh:"在 Composition 里创建 Three.js scene/camera/renderer，挂到 React 组件",effortZh:"首个场景 2–4 小时"},{stepZh:"绑时间轴",detailZh:"用 useCurrentFrame 驱动相机位置、物体旋转与材质 uniform",effortZh:"随改随看"},{stepZh:"预览",detailZh:"npx remotion studio 检查构图、材质与帧间连续性",effortZh:"随改随看"},{stepZh:"渲染",detailZh:"npx remotion render src/index.ts Scene --gl=vulkan --frames=0-149",effortZh:"5 秒 720p 约 47 秒"}],differentiators:["3D 场景就是 React 组件，能与文字、图表、UI 共享同一条时间轴","Three.js 生态的材质、着色器与几何体可直接复用","Remotion Studio 里实时看 WebGL 画面，调相机不用盲猜","官方模板给出可运行的相机/材质绑定范式，改造成本低"],limits:["只是模板，不含模型资产、UV、烘焙、GI 与后期合成","依赖 Chromium WebGL，高面数/复杂材质会掉帧，Windows 需指定 GL 后端","没有 Blender 级写实渲染，产品级静帧质感不足","没有音频与字幕编排，长片要自己组织 Series"],compareTips:[{vs:"remotion-dev__template-code-hike",adviceZh:"讲代码选 code-hike；讲 3D 物件与镜头选 template-three，两者可同工程共存"},{vs:"0xS4N4TG__kinetograph",adviceZh:"要无浏览器原生合成与硬件编码选 Kinetograph；要 Three.js 生态与 React 混排选此模板"},{vs:"SkyeShark__eidoverse-video",adviceZh:"要角色、物理、天气与电影级场景选 Eidoverse；要轻量 3D 产品镜头选 template-three"}],showcase:{demoBriefZh:"四段：①Three.js 场景在 Studio 实时预览；②相机环绕几何体；③材质参数逐帧变化；④3D 物件上叠 2D 标题，渲染 720p30/150 帧 MP4",featureCallouts:[{titleZh:"React 里的 3D",descZh:"场景即组件，时间轴统一"},{titleZh:"相机运动",descZh:"按帧驱动环绕与推拉"},{titleZh:"材质动画",descZh:"金属/玻璃随帧变化"},{titleZh:"3D+2D 混排",descZh:"标题与标签叠在物件上"},{titleZh:"Studio 实时预览",descZh:"WebGL 画面改完即时可看"}]},evidence:[{field:"taglineZh",source:"README.md#L1-L20",noteZh:"官方 Three.js 模板，Composition 驱动 3D 场景"},{field:"capabilities.automationZh",source:"package.json#L1-L30",noteZh:"Remotion 工程脚本与依赖，渲染走 @remotion/cli"},{field:"ceilingZh",source:"_samples/remotion-dev__template-three/meta.json",noteZh:"实测 720p Zh:"强：run_agent_single.sh 单题、批量模式脚本，全流程无人值守（有 Key 时）",assetsZh:"IconFinder 图标（可选 Key）、Manim 内置字体与图形；无素材库",exportFormatsZh:["mp4（Manim 渲染）","中间产物 .py 场景文件"],realtimePreviewZh:"无；生成后直接渲染",ciFriendlyZh:"中等：可脚本化，但需要外部 API 与 Key，不适合离线 CI"},ceilingZh:"它最强的不是画质而是流程：一条知识点能自动走完分镜—代码—修版式—渲染，代码可人工改一行重渲，批量 117 题也有基准可对照。质量上限取决于模型组合，README 给出的最佳配置是 Claude-4-Opus 写 Manim、gemini-2.5-pro 做 Critic；分辨率随 Manim 到 1080p（4K 未验证），单条 1–3 分钟。最复杂的产出是 4K 加速视频示例（README 展示对比素材，本机未验证）。边界很硬：api_config.json 不填 Key 就完全不能跑，本次因此跳过；生成代码常有布局重叠，需要 Critic 多轮甚至人工兜底；没有配音/字幕链路；Windows 支持未确认，脚本以 shell 为主。批量的稳定性也取决于重试次数与 Key 额度，一次跑十条以上建议人工抽检。",workflow:[{stepZh:"装 Manim 环境",detailZh:"按 ManimCE v0.19 官方指南装 Python、ffmpeg、LaTeX，再 cd src && pip install -r requirements.txt",effortZh:"约 40 分钟"},{stepZh:"填 API Key",detailZh:"在 api_config.json 填 LLM（推荐 Claude-4-Opus）、VLM（Gemini-2.5-pro）与可选 IconFinder Key",effortZh:"约 10 分钟"},{stepZh:"改运行参数",detailZh:"编辑 run_agent_single.sh 里的知识点、模型、重试次数等",effortZh:"约 10 分钟"},{stepZh:"跑智能体",detailZh:'sh run_agent_single.sh --knowledge_point "Linear transformations and matrices"',effortZh:"按题目复杂度，数分钟到数十分钟"},{stepZh:"人工复核",detailZh:"检查生成的 .py 与成片，改代码后单独用 manim 重渲",effortZh:"每题 5–15 分钟"}],differentiators:["代码作为中间表示：可复现、可改、可版本管理，不像扩散模型一次一版","三智能体分工明确，Critic 用 VLM 做版式修正","自带 MMMC 117 题基准与效率/美学/知识传递三维评测","可批量跑知识点列表，适合题库化生产"],limits:["必须自备付费 LLM/VLM Key，无 Key 完全不可用","生成代码常出现布局重叠，需 Critic 多轮或人工兜底","无配音、字幕、剪辑链路，成片只是 Manim 原始输出","以 shell 脚本为主，Windows 与离线环境未验证"],compareTips:[{vs:"Vincentwei1021__video-shotcraft",adviceZh:"要自然影像风格与镜头语言选 video-shotcraft；要可复现的教学动画与代码中间产物选 Code2Video"},{vs:"3b1b__manim",adviceZh:"ManimGL 是手工创作引擎；Code2Video 用 ManimCE 自动生成，质量与可控性都在其次，胜在批量"},{vs:"cth9191__animate",adviceZh:"animate 面向短视频叙事与画风；Code2Video 面向知识点讲解与学术评测"}],showcase:{demoBriefZh:"本批未出片（缺 API Key）。若演示，建议四段：①输入一个知识点，展示 Planner 输出的分镜；②看 Coder 生成并自修复的 Manim 代码；③Critic 前后的版式对比（重叠/越界修正）；④批量模式连出三条不同知识点，展示基准评分表",featureCallouts:[{titleZh:"Tri-Agent",descZh:"Planner / Coder / Critic 三段式生成"},{titleZh:"可执行代码",descZh:"视频由 Manim 代码生成，可改可复现"},{titleZh:"MMMC 基准",descZh:"117 个 3b1b 风格知识点"},{titleZh:"VLM 修版式",descZh:"按锚点重排重叠与越界元素"},{titleZh:"批处理脚本",descZh:"run_agent_single.sh 一条命令出片"}]},evidence:[{field:"summaryZh",source:"README.md#L198-L205",noteZh:"代码中心范式、Tri-Agent、MMMC 117 题基准与多维评测"},{field:"limits 第 1 条",source:"README.md#L224-L238",noteZh:"必须填 LLM/VLM Key，推荐 Claude-4-Opus 与 gemini-2.5-pro"},{field:"workflow 第 4 步",source:"README.md#L240-L252",noteZh:"run_agent_single.sh 以 knowledge_point 参数驱动"},{field:"limits 第 4 条",source:"_samples/showlab__Code2Video/meta.json",noteZh:"未执行：无 API Key，按规则跳过"}]},"simonw__shot-scraper":{id:"simonw__shot-scraper",taglineZh:"用 YAML 分镜指挥浏览器：截图、点击、滚动、等待，录成网页操作演示视频",summaryZh:"shot-scraper 是 Simon Willison 写的 Python CLI，本职是网页截图与抓取，但带一个 storyboard 子命令：写一份 YAML，声明 URL、视口、fps、光标与 scenes，每一步可等待元素、执行 JS、点击、输入、滚动，Playwright 驱动 Chromium 录制，输出 WebM，可用 --mp4 转 MP4。它解决“录产品网页演示要手动操作、画面不稳”的问题——分镜声明式，重跑即可复现。与 Remotion 相比它录的是真实交互，与 Multiplane 相比没有景深与确定性校验。它适合把 SaaS 产品的真实操作录成说明片，而不是做美术动画。",whatItMakes:[{type:"网页产品演示",exampleZh:"打开首页、点击菜单、切换主题、滚动到功能区",strength:"核心能力"},{type:"功能操作教学",exampleZh:"填表、提交、等待结果、展示成功页",strength:"核心能力"},{type:"网页截图/PDF 批量",exampleZh:"多 URL 截图、整页 PDF、元素级截图",strength:"核心能力"},{type:"可访问性/结构抓取",exampleZh:"导出无障碍树、抓取 JS 渲染后的 HTML",strength:"可用"},{type:"需要镜头语言的宣传片",exampleZh:"只能录真实网页，无法做 3D、景深与程序化转场",strength:"受限"}],useCases:[{scenarioZh:"SaaS 功能演示视频",whoZh:"产品经理、售前",whyZh:"YAML 分镜重跑即复现，不依赖人手操作",deliverableZh:"1280×720 的 1–3 分钟 MP4/WebM",fit:"高度契合"},{scenarioZh:"技术文档配图",whoZh:"技术作者",whyZh:"同一份 storyboard 既出视频又出截图",deliverableZh:"PNG/PDF + WebM",fit:"高度契合"},{scenarioZh:"自动化验收录像",whoZh:"测试/工程团队",whyZh:"CLI 可脚本化，失败路径也能录下来",deliverableZh:"操作回放 WebM",fit:"适合"},{scenarioZh:"营销级产品片",whoZh:"市场团队",whyZh:"没有动画编排、景深、字幕与配乐，观感偏“录屏”",deliverableZh:"需后期加工",fit:"勉强"},{scenarioZh:"需要登录态的页面",whoZh:"内部系统团队",whyZh:"可用 auth 存登录态，但复杂 SSO/MFA 仍要人工介入",deliverableZh:"内网演示",fit:"勉强"}],capabilities:{maxResolutionZh:"viewport 可设，实测 1280×720；无文档上限",maxFpsZh:"storyboard 的 fps 字段在已 期",exampleZh:"png/jpg/webp 打包成 .tar，交给 AE 或 ffmpeg 再合成",strength:"可用"},{type:"带音轨的成片",exampleZh:"传入一个 AudioBuffer，mp4/webm 会混入音频轨",strength:"受限"}],useCases:[{scenarioZh:"已有 canvas 作品加导出功能",whoZh:"前端开发者、生成艺术作者",whyZh:"作品已在浏览器里跑，只差一个「导出视频」按钮，不想引入整套渲染框架",deliverableZh:"4 秒 1280×720 30fps MP4，约 684KB",fit:"高度契合"},{scenarioZh:"课程演示动画出片",whoZh:"教师、课程制作团队",whyZh:"p5.js 写的几何/函数演示可直接录成固定帧率视频，不受演示机性能影响",deliverableZh:"单条 1–5 分钟 720p MP4 + GIF 缩略版",fit:"适合"},{scenarioZh:"WebGL 生成艺术批量导出",whoZh:"数字艺术家、NFT 创作者",whyZh:"逐帧确定性强，同一 seed 每次导出像素一致，便于版本管理",deliverableZh:"10–60 秒 1080p MP4 或图片序列",fit:"高度契合"},{scenarioZh:"文档与博客配图",whoZh:"技术写作者",whyZh:"GIF 一行配置就能出，不需要额外转码工具",deliverableZh:"3–8 秒 480p GIF，<5MB",fit:"适合"},{scenarioZh:"CI 中自动出片",whoZh:"工具链维护者",whyZh:"用 Playwright 打开页面、触发下载即可保存，无需图形界面",deliverableZh:"自动化产出的 MP4 附件",fit:"勉强"}],capabilities:{maxResolutionZh:"未声明上限，取决于 canvas 尺寸与浏览器编码器；实测 1280×720，奇数或改变尺寸的帧会被自动补齐到偶数编码尺寸",maxFpsZh:"framerate 默认 60，可任意设定；实际受浏览器编码吞吐限制，实测 30fps 输出",durationZh:"默认不限时长（timeLimit/frameLimit 均为 0）；可用 autoSaveTime 分段下载以控制内存",effectsZh:["虚拟时钟 TimeWarp（可快进、可定格）","子帧运动模糊（GPU 或 CPU 后端）","视频/音频元素逐帧步进","自定义编码器（FrameEncoder/BatchEncoder）"],audioZh:"可传一个 AudioBuffer 混入 mp4/webm 音轨，默认 128kbps；无 TTS、无字幕、无多轨混音",interactivityZh:"浏览器内 API 调用，可选 display 显示页内捕获状态小部件；没有编辑器或时间轴",automationZh:"无 CLI；需宿主页面 + Playwright 触发下载，本次实测即走此路径",assetsZh:"无内置素材、字体或模板，画面内容全部由宿主 canvas 绘制",exportFormatsZh:["mp4（H.264/AV1）","webm（VP9/VP8/AV1）","webm-legacy","gif","png/jpg/webp 的 tar 包"],realtimePreviewZh:"捕获期间按虚拟时钟推进，不是实时播放；可随时 stop 后恢复实时循环",ciFriendlyZh:"中等：需要 Chromium 与宿主页，可脚本化，但无现成录制命令"},ceilingZh:"能力上限由 canvas 尺寸与浏览器编码器决定。实测 1280×720、30fps 下 120 帧仅 3.46 秒，折合约 29ms/帧，按此外推 4 分钟 60fps（14400 帧）约 7 分钟；timeLimit/frameLimit 默认 0，时长不设硬上限，autoSaveTime 可分卷下载来绕开内存。最复杂的效果是 GPU 子帧运动模糊（多张子帧平均进一帧）与自定义编码器——接口只有 start/add/save/dispose，可以挂 WASM 编解码、APNG 或上传服务端。边界很硬：没有 CLI、工程脚手架、时间轴、字幕和音频管线，宿主页要自己写；GIF 只有 256 色，且延时按厘秒取整，60fps 素材实际回放约 50fps；浏览器不支持 WebCodecs 时 mp4 直接抛错，只能退回 webm。总体是「小而快」的录制内核，适合嵌进已有页面。帧率 yZh:"中等：需编译 headless-gl 或用预编译 webgl.node"},ceilingZh:"它最强的是转场自由度：gl-transitions 库里几百种着色器可以逐段指定、逐段调参（方向、强度、时长），这是 ffmpeg 原生转场给不了的。实测 640×360、25fps、266 帧用 10.6 秒，约 26fps；时长无上限，但拆帧会占大量临时磁盘，长片建议分段。边界很硬：输出尺寸与帧率被第一段视频锁死（README 写明），想改规格必须先转码素材；只能出 mp4；没有字幕、文字、图层能力；gl 是原生依赖，Windows 需 node-gyp 或手动放 webgl.node；项目 2018 年成型，后续活动很少，现代 Node 上安装成功率不高。另外它把每帧写成 PNG 临时文件，长片会占用数 GB 磁盘；转场时长以毫秒计，超过片段长度时会报错。项目没有维护承诺，新 Node 版本的兼容性逐年下降。",workflow:[{stepZh:"安装",detailZh:"npm install ffmpeg-concat，并准备 ffmpeg；Windows 需 MSVC 编译 gl 或放预编译 webgl.node",effortZh:"20–40 分钟"},{stepZh:"准备素材",detailZh:"把所有片段转成第一段的尺寸与帧率，避免成片规格漂移",effortZh:"按素材量"},{stepZh:"写配置",detailZh:"videos 数组 + transition 或 transitions 数组（N 段需 N-1 个转场）",effortZh:"约 15 分钟"},{stepZh:"执行拼接",detailZh:"await concat({videos, output, transition})，指定 audio 可覆盖音轨",effortZh:"实测 10 秒片约 11 秒"},{stepZh:"检查成片",detailZh:"确认尺寸与帧率等于第一段，再按需转码或加字幕",effortZh:"约 5 分钟"}],differentiators:["逐段独立 GL 转场，几百种 gl-transitions 可直接用","配置即用，不用手写复杂 ffmpeg filtergraph","可传音频覆盖整条成片音轨","CLI 与 Promise API 双入口，易脚本化"],limits:["输出尺寸与帧率被第一段视频锁死","只支持 mp4，其他格式要二次转码","无字幕、文字、图层，包装能力为零","原生 gl 依赖，Windows 与新版 Node 安装容易失败"],compareTips:[{vs:"mifi__editly",adviceZh:"Editly 是它的精神继任者：流式处理、更快、省盘，还支持字幕/音频混音；除非只要转场拼接，优先 Editly"},{vs:"h2non__videoshow",adviceZh:"图片幻灯片用 videoshow；视频片段拼接加转场用 ffmpeg-concat"},{vs:"mowshon__moviego",adviceZh:"要 Go 后端集成与字幕/混音选 moviego；只要 GL 转场效果选 ffmpeg-concat"}],showcase:{demoBriefZh:"四段：①三段素材用 fade 拼接；②逐段指定 directionalwipe 与 circleopen，展示不同着色器；③传音频覆盖整条音轨；④故意混入不同尺寸素材，展示输出被第一段锁死",featureCallouts:[{titleZh:"gl-transitions",descZh:"几百种着色器转场可直接引用"},{titleZh:"逐段转场",descZh:"N 段可配 N-1 个不同转场"},{titleZh:"音频覆盖",descZh:"一个音频文件接管整条成片"},{titleZh:"CLI + API",descZh:"命令行一条或 Promise 调用"},{titleZh:"参数覆盖",descZh:"方向、强度、时长可逐段调"}]},evidence:[{field:"taglineZh",source:"README.md#L17-L21",noteZh:"自述用 ffmpeg + OpenGL 转场拼接视频，替代复杂 filtergraph"},{field:"limits 第 1 条",source:"README.md#L124",noteZh:"输出视频的尺寸与 fps 由第一段输入决定"},{field:"limits 第 2 条",source:"README.md#L142",noteZh:"当前只支持输出 :["FFmpeg 全部滤镜（裁剪/水印/混音/字幕）","硬件编码 NVENC/QSV/VideoToolbox","预置参数模板","watchfolder 自动触发"],audioZh:"通过 FFmpeg 支持混音、音量、编码与抽取；不内置 TTS",interactivityZh:"有 Web UI 可查看队列与任务，但不是剪辑界面",automationZh:"REST API + webhook + watchfolder，可完全脚本化",assetsZh:"任意 FFmpeg 可读素材；预设与参数存服务端",exportFormatsZh:["任意 FFmpeg 输出格式（MP4/MKV/WebM/音频等）"],realtimePreviewZh:"无实时画面预览，只有任务状态",ciFriendlyZh:"可进 CI：Docker 镜像 + REST 提交 + 状态轮询"},ceilingZh:"它的上限是“把 FFmpeg 的吞吐组织起来”：实测启动服务后 POST 一个 4 秒 1280×720 的 testsrc2 任务，纯任务耗时 2.28 秒（h264_nvenc），总流程 120 秒（含服务启动与收尾），说明单任务接近编码极限，真正的价值在队列与并发。多实例集群、watchfolder 与 webhook 让它可以承接课程批量压制、媒体资产流水线这类每天数百条的任务。边界：它不生成画面，所有创意仍要在上游完成；Windows 实测中文输出路径被解码成乱码目录，首个任务失败，需要先输出到英文路径再搬；服务闲置约 34 分钟后出现 SQLite `database is locked` 并 panic（上游 bug）；AGPLv3 对闭源商用有传染性；所有能力依赖本机 FFmpeg 版本与硬件编码器。",workflow:[{stepZh:"安装依赖",detailZh:"装 FFmpeg 与 Go 1.24+，或直接下载预编译二进制",effortZh:"约 10 分钟"},{stepZh:"启动服务",detailZh:"./ffmate server --port 3000，默认 API 在 http://localhost:3000",effortZh:"约 1 分钟"},{stepZh:"配置预设",detailZh:"在 Web UI 里建 preset（编码器、码率、滤镜、输出模板）",effortZh:"约 15 分钟"},{stepZh:"提交任务",detailZh:"POST /api/v1/tasks，传 command/inputFile/outputFile，或交给 watchfolder",effortZh:"脚本化即可"},{stepZh:"接回调",detailZh:"配 webhook 接收完成/失败事件，再接通知或下游流程",effortZh:"约 30 分钟"}],differentiators:["把 FFmpeg 命令变成可查询、可重试、可并发的任务，而不是一摞 shell 脚本","REST API + Web UI + watchfolder + webhook 四套入口，容易接现有系统","支持多实例集群，队列可跨机器分发","Go 单二进制部署，Docker 镜像开箱即用"],limits:["不生成任何画面，只是 FFmpeg 的任务编排层","Windows 中文输出路径会乱码导致任务失败，实测需绕开","闲置约 34 分钟出现 SQLite database is locked 并 panic","AGPLv3 许可，闭源商用需评估传染性"],compareTips:[{vs:"LBEILC__Multiplane",adviceZh:"要生成动画画面选 Multiplane；要处理已有素材、批量转码与队列选 FFmate，二者可串成上下游"},{vs:"Vincentwei1021__video-shotcraft",adviceZh:"要创意与分镜流程选 video-shotcraft；要稳定跑量、转码与回调选 FFmate"},{vs:"asciinema__agg",adviceZh:"agg 只做 cast→GIF；要任意格式转码与批处理才需要 FFmate"}],showcase:{demoBriefZh:"四段：①启动 ffmate server 打开 Web UI；②创建 NVENC 预设并展示参数；③POST 一个 4 秒测试任务，状态从排队到成功；④webhook 回调与失败任务重试",featureCallouts:[{titleZh:"REST 任务队列",descZh:"提交、排队、查状态与结果"},{titleZh: arioZh:"AI 无人值守出片",whoZh:"用 LLM 生成 HTML 的开发者",whyZh:"同输入同输出 + qa.js 自动判红绿，模型可自循环修片",deliverableZh:"模板化短片，自动验收",fit:"适合"}],capabilities:{maxResolutionZh:"任意 --width/--height；内置 1920×1080、1080×1440、1080×1920 预设，实测 1280×720",maxFpsZh:"任意帧率，真 60fps（逐帧 seek，不是插帧），实测 30fps",durationZh:"按 --duration 指定，无硬限制；实测 6 秒",effectsZh:["Canvas 2D 绘制与运镜","8 种镜头转场","40+ 图标、参数化人物、卡片箭头、纹理","透明通道叠加层"],audioZh:"支持外部配乐；可用 --srt 挂字幕时间轴，不内置 TTS",interactivityZh:"仅离线渲染；HTML 可先在浏览器预览",automationZh:"CLI 可脚本化：node scripts/render-video-seek.js，支持 --concurrency/--gop/--tmpdir/--out",assetsZh:"纯代码素材零版权依赖；模板、图标、纹理都在 assets/；字体走系统或自带",exportFormatsZh:["MP4（H.264）","GIF","PNG 封面","透明视频层"],realtimePreviewZh:"部分：HTML 可直接浏览器打开，另有在线预览页",ciFriendlyZh:"可进 CI：脚本化渲染 + qa.js 六维质量门"},ceilingZh:"它能做到“一支完整片子”：一个 HTML 里排多镜头、加 8 种转场、持续运镜，不用渲几段再拼；同一份代码用 --presets=douyin,xiaohongshu,youtube 直接出 1920×1080、1080×1440、1080×1920 三套不裁切的成片。实测 6 秒 1280×720@30（180 帧）用 4 个 worker 渲染 54 秒，总耗时 60 秒，约 3.3 帧/秒，说明瓶颈在无头浏览器截图与串行 seek；60fps 的 1080p 长片会明显更慢。边界：表现力锁在 Canvas 2D，做不了真 3D 与实拍质感；模板之外的画面要自己写 Canvas 代码；并发数受内存与显存限制，实测 4 worker 稳定；批量与透明通道都依赖 ffmpeg 参数，跨平台仍需本机装 Chrome/Chromium 与 ffmpeg。它对中文字体回退有专门检测，但字体仍需本机安装或内嵌，服务器上要自己带字体文件；长片建议分段渲染再拼。",workflow:[{stepZh:"安装",detailZh:"Node ≥18，npm install 装 Playwright 与依赖，准备 ffmpeg 在 PATH",effortZh:"约 5 分钟"},{stepZh:"选模板",detailZh:"复制 assets/templates 下某个 HTML，改顶部 CFG 的标题与数据",effortZh:"约 10 分钟"},{stepZh:"写画面",detailZh:"把动画写成 frame(t) 纯函数，或用多镜头表与转场；需要时加 --srt 字幕",effortZh:"简单片子 1–3 小时"},{stepZh:"渲染",detailZh:"node scripts/render-video-seek.js video.html --duration=6 --fps=30 --width=1280 --height=720 --out=out.mp4",effortZh:"6 秒 720p 约 1 分钟"},{stepZh:"质量门",detailZh:"跑 qa.js 检查确定性、卡顿、跳变、半截字、叠字与字体回退",effortZh:"约 1 分钟"}],differentiators:["零构建：HTML 直接在浏览器跑，渲染时才起无头 Chromium，不需要 React 工程","一条命令出横屏、方图、竖屏三套原生版式，不靠裁切","内置六维自动化 QA，把画面问题变成可脚本判断的指标","纯代码素材库，40+ 图标与参数化人物零版权风险"],limits:["只有 Canvas 2D，做不了真 3D、粒子 GPU 管线与实拍质感","无头浏览器逐帧截图，60fps 1080p 长片的渲染时间会线性膨胀","模板之外要从零写 Canvas，复杂分镜的代码量不比 React 少","依赖本机 Chrome/Chromium 与 ffmpeg，跨平台需自行处理路径"],compareTips:[{vs:"remotion-dev__remotion",adviceZh:"要 React 组件复用与云端批量选 Remotion；只有一屏现成 HTML 想直接变 MP4，选这个更省事"},{vs:"LBEILC__Multiplane",adviceZh:"要运镜、景深、运动模糊与多 worker 的 HTML 渲染选 Multiplane；要模板、批量比例与 QA 质量门选 html-to-video"},{vs:"BintzGavin__helios",adviceZh:"要原生 CSS 动画时间轴与播放器组件选 Helios；画面本来就是 Canvas 函数，html-to-video 的 seek 模型更直接"}],showcase:{demoBriefZh:"四段：①demo-hero.html 在浏览器里播放；②渲染器 4 worker 逐帧 seek 的过程；③同一 HTML 用 --presets 出横屏/竖屏/方图三套；④qa.js 报告把黑屏与半截字标红",featureCallouts:[{titleZh:"HTML 进 MP4 出",descZh:"无需构建，一条命令"},{titleZh:"真 60fps",descZh:"逐帧 seek 截图，不靠插帧补"},{titleZh:"三平台预设",descZh:"横屏/竖屏/方图不裁切"},{titleZh:"六维 QA",descZh:"黑屏、卡顿、半截字自动判"},{titleZh:"透明叠加层",descZh:"--alpha 叠到实拍画面上"}]},evidence:[{field:"taglineZh",source:"README.md#L21-L31",noteZh:"HTML/Canvas 动画 → 无头浏览器逐帧 seek 截图 → ffmpeg H.264"},{field:"whatItMakes",source:"README.md#L33-L50",noteZh:"列出确定性、真 60fps、--alpha、--srt、--gif/--poster/--batch 等能力"},{field:"capabilities.automationZh",source:"README.md#L394-L414",noteZh:"CLI 参数 --concurrency/--gop/--tmpdir/--out"},{field:"ceilingZh",source:"_samples/wx4766__html-to-video/meta.json",noteZh:"实测 6s/1280×720/30fps/180 帧，4 worker，render 54s，总 60s"}]},ybouane__VideoFlow:{id:"ybouane__VideoFlow",taglineZh:"用 TypeScript 编排时间轴、编译成一份 JSON，可在浏览器或 Node 渲成 MP4 的视频框架",summaryZh:"2026 年的新框架（v1.3.4，Apache-2.0）。它把视频写成一段可读的流程：addText 加图层，wait 推进时间，每层 animate 描述进出场，最后 compile 成一份自描述的 VideoJSON；同一份 JSON 有四个渲染器——DOM 实时预览、浏览器 WebCodecs、Node headless Chromium，以及一个可插拔的 React 剪辑器。内置 25 种以上进出场预设与 WebGL 效果管线（泛光、色差、调色），尺寸默认用 em 相对单位，1920×1080 的版式可以直接渲成 720p 或 4K。不绑定 React，但渲染吞吐很慢。官网 playground 可以在线试，不用先装包。定位是短平快的动态图文，而不是长篇课程。",whatItMakes:[{type:"数据/营销短片",exampleZh:"标题、数字滚动、图表图层按时间线进出场，出 1080p30 短片",strength:"核心能力"},{type:"文字动效与片头",exampleZh:"slideUp、blurResolve、glitchResolve、typewriter、numberCountUp 等预设",strength:"核心能力"},{type:"Shader 质感片头",exampleZh:"bloom、chromaticAberration、colorCorrection 的参数可逐帧动画",strength:"核心能力"},{type:"多分辨率同版式",exampleZh:"em 单位让一份布局在 720p、1080p、4K 上等比排布",strength:"可用"},{type:"编辑器模板换文案",exampleZh:"同一份 JSON 喂给 VideoFlow React 编辑器改字、改图",strength:"可用"},{type:"分钟级长视频",exampleZh:"结构上不限时长，但实测帧率 0.32fps，一分钟片要按小时算",strength:"受限"}],useCases:[{scenarioZh:"数据可视化短片",whoZh:"运营、数据分析师 + 前端",whyZh:"数字滚动与柱状图都用代码描述，数据一变重跑即可",deliverableZh:"1080p30 的 10–60 秒 MP4",fit:"高度契合"},{scenarioZh:"产品发布会/社媒片头",whoZh:"品牌内容团队",whyZh:"文字动效预设与 shader 管线足够做出高级感片头",deliverableZh:"5–15 秒 1080p MP4，可加配乐",fit:"适合"},{scenarioZh:"服务端批量出片",whoZh:"后端团队",whyZh:"renderVideo 在 Node 里跑 headless Chromium，可塞进队列，但单帧成本高",deliverableZh:"每小时数十到上百条短片的产能",fit:"勉强"},{scenarioZh:"可视化编辑器",whoZh:"SaaS 产品团队",whyZh:"JSON 模型与官方 React 编辑器共用格式，可直接做换文案工具",deliverableZh:"带编辑器的出片产品",fit:"适合"},{scenarioZh:"教学讲解长视频",whoZh:"教师",whyZh:"没有内置 LaTeX/公式排版，长片渲染成本极高",deliverableZh:"不适合直接做 10 分钟课程",fit:"勉强"}],capabilities:{maxResolutionZh:"默认 1920×1080，em 相对单位可写到 4K；实测输出 1280×720 后再转码验证",maxFpsZh:"默认 30，可配置；实测 30fps，高帧率会线性拉长渲染时间",durationZh:"结构上不设硬上限，取决于渲染时长；实测 93 帧用了 294 秒",effectsZh:["25+ 进出场预设（slideUp/blurResolve/glitchResolve/typewriter/numberCountUp 等）","WebGL 效果管线（bloom/chromaticAberration/colorCorrection）","逐层 animate 与 parallel 时间线","任意参数可动画"],audioZh:"未确认音频 API 细节；README 的三渲染器说明未列出音轨能力",interactivityZh:"DOM 渲染器提供可拖拽时间轴的实时预览；另官方 React 编辑器可直接改 JSON",automationZh:"renderVideo 自动识别环境，Node 24 + tsx 可直接跑脚本；无官方任务队列",assetsZh:"图片、视频、字体图层；无内置素材库与 TTS",exportFormatsZh:["mp4（服务端 Chromium）","mp4（浏览器 WebCodecs + MediaBunny）","VideoJSON（可存储/传输）"],realtimePreviewZh:"有：@videoflow/renderer-dom 实时播放并可 scrub",ciFriendlyZh:"中等：Node 环境可跑，需 playwright chromium；长片耗时高，不适合频繁 CI"},ceilingZh:"它最强的地方是「一份 JSON 三渲染器」：代码写的片子和编辑器改的片子共用同一模型，分辨率无关的 em 布局让 1920 版式原样出 4K。效果上限是 shader 管线：泛光、色差、调色都能逐帧调参，配合 25 种以上进出场预设做片头足够。但吞吐是硬边界：实测 93 帧 720p 用了 294 秒，约 0.32fps，按此一分钟 30fps 片子要 5400 秒左右；原因是它按元素逐层截图而非整帧合成。批量能力只能自己写循环，官方没有队列/并发方案。此外它不擅长数学排版（无 LaTeX）、没有确认的音轨 API、社区体量小（约 170 stars），遇到问题基本靠读源码。4K 与 60fps 官方没给实测数据，本机只验证到 720p。",workflow:[{stepZh:"安装核心包",detailZh:"npm install @videoflow/core，再按环境选 renderer
